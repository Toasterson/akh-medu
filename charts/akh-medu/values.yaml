# ── Global ─────────────────────────────────────────────────────────────────
global:
  imageRegistry: ""
  # Allow non-Bitnami pgvector image (required for pgvector/pgvector).
  security:
    allowInsecureImages: true

# Mandatory credential shared by akhomed ACP/TCP clients and every seshd HTTP
# client. The default references an externally provisioned Secret so credentials
# never land in chart defaults or rendered release history. It must contain the
# `tokens` key with one accepted token per non-empty line. Multiple lines enable
# overlap rotation; see docs/ops/ingress-shared-secret.md.
ingressAuth:
  existingSecret: "akh-medu-ingress-auth"
  secretKey: tokens
  # Dev-only alternative: set existingSecret="" and provide the current token
  # here. Helm will create <release>-akh-medu-ingress-auth. Prefer an external
  # secret controller in production.
  sharedSecret: ""
  # Optional overlap token used only by the chart-created Secret.
  previousSharedSecret: ""
  mountPath: /var/run/secrets/akh-medu/ingress-auth

# CPU architectures for which akhomed and seshd images have been built.
# Pods are pinned to nodes matching one of these via required nodeAffinity
# on `kubernetes.io/arch`. Add "arm64" here only after publishing arm64 images.
supportedArchitectures:
  - amd64

# ── akhomed (akh-medu daemon) ──────────────────────────────────────────────
akhomed:
  enabled: true
  replicaCount: 1

  image:
    repository: code.aopc.cloud/toasterson/akhomed
    tag: ""  # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8201

  # Numeric uid/gid overrides for the pod securityContext. Defaults (999 /
  # 999 / 999) match the `akh` user baked into the runtime image — see the
  # comment on `securityContext` in akhomed-deployment.yaml for why these
  # must be numeric rather than the image's `USER akh` name. Override only if
  # you rebuild the image with a different uid/gid.
  securityContext: {}

  # ACP transport — the daemon's only inbound surface (ADR-061). TCP must bind
  # 0.0.0.0 (not the config default 127.0.0.1) so the kubelet probe and the
  # Service can reach it. Injected as AKH_ACP_TCP_{PORT,BIND} env (see deployment).
  acp:
    tcpPort: 8201
    tcpBind: "0.0.0.0"

  # Environment variables passed to akhomed. (Data/config/state paths come from
  # the XDG_* env set in the deployment template; ACP TCP from `acp` above.)
  env:
    AKH_AUTO_START: "default"
    RUST_LOG: "info"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4317"
    OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
    OTEL_SERVICE_NAME: "akhomed"
    OTEL_RESOURCE_ATTRIBUTES: "service.namespace=akh-medu,deployment.environment=prod"
    OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
    OTEL_TRACES_SAMPLER_ARG: "0.1"

  # Persistent volume for engine data (KG, HNSW, redb).
  #
  # In Postgres mode (ADR 049: PG = truth, redb = cache) the local data dir is
  # a rebuild cache, not a source of truth. WAL flushes go to Postgres
  # (`postgres.wal_flush_interval_secs`) and the snapshot ticker persists the
  # relational state every `postgres.snapshot_interval_secs`; `akh akh wake`
  # rebuilds KG + HNSW + redb from Postgres into a fresh dir. On a Raspberry
  # Pi the dir is therefore redundant AND a wear hazard (continuous small
  # writes to the SD card), so for arm64 nodes set `enabled: false` +
  # `medium: Memory` to put it on tmpfs.
  #
  # Exposure bound: with persistence disabled, an ungraceful exit (power cut,
  # OOM kill, SIGKILL) drops everything since the last WAL flush. The bound is
  # `postgres.wal_flush_interval_secs` (default 2s) plus whatever is in the
  # in-memory WAL buffer up to `postgres.wal_max_buffer_mb` (default 16 MiB),
  # beyond which the overflow drop policy applies. A graceful pod delete is
  # safe: `shutdown_wals` takes a final snapshot per workspace and drains the
  # WAL flusher, so SIGTERM → snapshot → flush → exit loses nothing the PG
  # copy didn't already have. `terminationGracePeriodSeconds` (below) must be
  # long enough for that final snapshot to land.
  persistence:
    enabled: true
    storageClass: ""
    size: 30Gi
    accessModes:
      - ReadWriteOnce
    # Only consulted when `enabled: false`.
    #
    # - `medium: ""` (default) → a plain `emptyDir` backed by the node's
    #   ephemeral storage. On a Pi that IS the SD card — do not use in
    #   production; it defeats the purpose of disabling persistence.
    # - `medium: "Memory"` → a real tmpfs (`emptyDir` + `medium: Memory`).
    #   Lives in RAM, never touches the SD card, and is what arm64 nodes
    #   want. Set `sizeLimit` to bound the RAM cost: the akh's redb + KG +
    #   HNSW cache for a small workspace is well under 1 GiB, but the WAL
    #   buffer adds up to `wal_max_buffer_mb` on top. On a wktiny node
    #   (1.8 GiB RAM) leave headroom for the container; on a full Pi (8 GiB)
    #   2Gi is comfortable. tmpfs that exceeds `sizeLimit` evicts to the
    #   node's ephemeral storage, so keep this above the working set.
    medium: ""
    sizeLimit: ""

  # Grace period the kubelet gives the pod on SIGTERM before sending SIGKILL.
  # Must exceed the worst-case final-snapshot duration: on shutdown
  # `shutdown_wals` stops the periodic snapshot ticker (5s drain), takes one
  # final snapshot per loaded workspace (synchronous `persist_snapshot` to
  # Postgres), then drains each WAL flusher (5s). With one workspace the
  # floor is ~10s plus the snapshot write; we default to 120s for headroom.
  # Measure on your workload (look for the `final snapshot written on
  # shutdown` log line's distance from `Stopped on graceful shutdown`) and
  # tighten if you want faster evictions. Too short and a SIGKILL mid-snapshot
  # drops everything since the last WAL flush (see `persistence` comment).
  terminationGracePeriodSeconds: 120

  # NLU models volume (ONNX NER model, LLM GGUF, Candle models).
  #
  # Separate concern from the data dir: this is a 5 GiB read-mostly cache of
  # pre-built model weights. A tmpfs copy would cost real RAM on an 8 GiB Pi
  # (~1.1 GiB for the LLM GGUF alone), so do NOT set `medium: Memory` here.
  # Options for an arm64-only deployment that cannot use a zfs PVC (the
  # zfs pool lives on amd64 storage nodes):
  #   - Keep `enabled: true` with a `storageClass` that works on arm64
  #     (e.g. nfs, or a manual PV to a USB-attached SSD). Best if you have
  #     more than one arm64 akhomed replica or restart often.
  #   - Set `enabled: false` and let the models re-download on each pod
  #     start (`akh setup models`). Fine for a single replica with cheap
  #     egress; painful on a slow Pi uplink.
  #   - Pin the pod to an amd64 node (override `supportedArchitectures` and
  #     `nodeSelector`) and keep the zfs PVC. Trades the arm64 win for a
  #     working models cache.
  # The chart does not pick for you; decide per deployment.
  models:
    enabled: true
    storageClass: ""
    size: 5Gi
    accessModes:
      - ReadWriteOnce

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

  # Pod security context. The runtime image's `USER akh` is uid/gid 999, and
  # the kubelet cannot verify a NON-NUMERIC user against `runAsNonRoot` — it
  # fails with "image has non-numeric user (akh)". These must stay numeric.
  # fsGroup must equal the gid or akhomed cannot write its own PVCs.
  securityContext:
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999

  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Probes verify the ACP TCP listener is accepting connections — there is no
  # HTTP surface anymore (ADR-061), so the old httpGet /status probe could never
  # pass.
  probes:
    liveness:
      tcpSocket:
        port: acp
      initialDelaySeconds: 10
      periodSeconds: 30
    readiness:
      tcpSocket:
        port: acp
      initialDelaySeconds: 5
      periodSeconds: 10

  # ── Remote exec backend (ADR 082 / Phase 48c wiring) ─────────────────────
  # Optional SSH key + known_hosts mounted into the akhomed pod so an
  # arm64 node that cannot compile locally can route shell_exec/file_io to a
  # real build host (e.g. `armini`) over SSH. Per-workspace `[exec]` sections
  # in akh.toml reference these mounted paths (`key` / `known_hosts`).
  # Leave `sshKey.enabled = false` (the default) for workspaces that run
  # in-process — no volume is mounted and behaviour is unchanged.
  sshKey:
    enabled: false
    # Mount path inside the container for the SSH private key Secret.
    # akh.toml's `[exec] key` should point under this directory.
    mountPath: /etc/akh/ssh
    # Separate directory for the known_hosts ConfigMap. It must NOT be
    # inside `mountPath`: that Secret volume is mounted read-only, and runc
    # cannot create a subPath mountpoint inside a read-only directory.
    # akh.toml's `[exec] known_hosts` should point to
    # `<knownHostsMountPath>/known_hosts`.
    knownHostsMountPath: /etc/akh/ssh-hosts
    # The SSH private key (OpenSSH format, unencrypted — ADR 086 §1). Set
    # inline here for dev/eval; for anything real, use `existingSecret` to
    # reference a pre-provisioned secret you manage out-of-band. The secret
    # is mounted read-only and (when created here) chmod'd via an init
    # container to 0600 so other local users on the node can't read it.
    existingSecret: ""
    # Inline key material (used only when `existingSecret` is empty). The
    # chart creates a Secret from this; leave it empty to skip creation.
    privateKey: ""
    # Inline known_hosts file content. Mounted as a whole-dir ConfigMap at
    # `knownHostsMountPath`; the file appears at
    # `<knownHostsMountPath>/known_hosts`. Empty ⇒ no known_hosts is mounted
    # (the russh default `~/.ssh/known_hosts` is used instead — fine when
    # HOME is set, but typically you want an explicit known_hosts in a pod).
    knownHosts: ""

  # ── Declarative config (akhomed-config-configmap.yaml) ───────────────────
  # A k8s-resident akhomed has no operator attached to run `akh workspace
  # create` / edit config.toml by hand, so the host config and workspace
  # definitions have to arrive declaratively. Both render into one ConfigMap
  # mounted under $XDG_CONFIG_HOME/akh-medu (see the deployment's env). Only
  # non-secret config belongs here — DATABASE_URL, OLLAMA_CLOUD_KEY etc. go
  # through `extraEnv` sourced from a Secret, never inlined in these strings.
  configToml: ""      # host-wide config.toml content ([daemon]/[acp]/[postgres] sections)
  workspaces: {}      # map: workspace name -> workspace TOML content, lands at
                       # /data/config/akh-medu/workspaces/<name>.toml (read-only)

  # ── Generic passthroughs ──────────────────────────────────────────────────
  # Escape hatches for cases the chart doesn't model explicitly (e.g. a
  # DATABASE_URL composed from a Secret-injected password, or an extra
  # sidecar volume). Prefer the typed values above when they cover your case.
  extraEnv: []           # []EnvVar, appended after the built-in env vars
  extraEnvFrom: []        # []EnvFromSource
  extraVolumes: []        # []Volume, appended to the pod's volumes
  extraVolumeMounts: []   # []VolumeMount, appended to the container's volumeMounts

# ── seshd (Seshat's Archive) ──────────────────────────────────────────────
seshd:
  enabled: true
  replicaCount: 1

  image:
    repository: code.aopc.cloud/toasterson/seshd
    tag: ""  # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 9090

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: seshat.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

  env:
    RUST_LOG: "seshat=info"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4317"
    OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
    OTEL_SERVICE_NAME: "seshd"
    OTEL_RESOURCE_ATTRIBUTES: "service.namespace=akh-medu,deployment.environment=prod"
    OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
    OTEL_TRACES_SAMPLER_ARG: "0.1"

  # Seshat config (rendered as ConfigMap → mounted at /config/seshat.toml).
  config:
    database:
      # When empty AND postgresql.enabled=true, the URL is auto-constructed
      # from the subchart. Set this to use an external PostgreSQL instance.
      url: ""
      maxConnections: 10
    embedding:
      model: "all-MiniLM-L6-v2"
      batchSize: 32
      pollIntervalSecs: 30
    server:
      bind: "0.0.0.0:9090"
      transport: "streamable-http"
    synthesis:
      enabled: false
      backend: "candle"
      modelPath: ""
      maxTriples: 30

  # Models volume for embedding ONNX + synthesis GGUF models.
  models:
    enabled: true
    storageClass: ""
    size: 2Gi
    accessModes:
      - ReadWriteOnce

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

  nodeSelector: {}
  tolerations: []
  affinity: {}

  probes:
    # rmcp's streamable-http transport returns 406 to a plain GET /mcp
    # (it needs `accept: text/event-stream`), so a plain httpGet probe
    # on /mcp fails. Use tcpSocket to just verify the listener is open.
    # Once seshd grows a proper /healthz endpoint, this can flip back
    # to httpGet. NOTE: kube probe schema forbids multiple handler
    # types on the same probe, so an HR that overrides with `httpGet`
    # must either null out `tcpSocket` or (better) the chart template
    # needs a handler-exclusive render. Keeping the default aligned
    # with the production HR avoids the deep-merge foot-gun.
    liveness:
      tcpSocket:
        port: http
      initialDelaySeconds: 15
      periodSeconds: 30
    readiness:
      tcpSocket:
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10

# ── sokard (Sokar artifact daemon) ────────────────────────────────────────
# Off by default: sokar needs at least one [[store]] configured before it can
# start (config.rs::Config::validate rejects an empty store list), and there
# is no safe generic default for object-storage credentials. Set
# sokard.enabled=true and populate sokard.stores/sokard.principals below.
sokard:
  enabled: false
  replicaCount: 1

  image:
    repository: code.aopc.cloud/toasterson/sokard
    tag: ""  # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    apiPort: 9400
    adminPort: 9401

  env:
    RUST_LOG: "sokar=info,opendal=warn"

  mcp:
    enabled: true
    path: /mcp

  # Sokar config (rendered as ConfigMap → mounted at /config/sokar.toml).
  # Field names below map 1:1 onto crates/sokar/src/config.rs, which has
  # `#[serde(deny_unknown_fields)]` throughout — an unrecognized key crashes
  # the pod at startup, not just this chart's lint.
  config:
    # Must name one of the entries in `stores` below. Empty ⇒ default to the
    # first configured store.
    defaultStore: ""
    # Optional external API base URL; empty returns relative content URLs.
    publicApiUrl: ""
    limits:
      maxBodyBytes: 268435456
    # Optional: media types the API inlines in responses instead of
    # redirecting/presigning. Leave empty to use sokard's own default.
    delivery:
      inlineMediaTypes: []

  # [[store]] entries, rendered verbatim. Every entry needs `name` and
  # `service` (one of s3 | gcs | azblob | fs | memory); `prefix` is optional.
  # `options` becomes `[store.options]`. Non-secret settings (`bucket`,
  # `region`, `endpoint`, `root`) are plain literals; credentials MUST use
  # `env:NAME` or `file:/absolute/path` indirection (a literal that has to
  # start with `env:`/`file:` can be escaped as `literal:...`). Reference env
  # vars exposed to the pod
  # via `sokard.env`, `storeSecrets.existingSecret`, or your own extraEnvFrom.
  #
  # Example:
  #   stores:
  #     - name: lab
  #       service: s3
  #       prefix: sokar
  #       options:
  #         bucket: "env:SOKAR_S3_BUCKET"
  #         endpoint: "env:SOKAR_S3_ENDPOINT"
  #         region: "env:SOKAR_S3_REGION"
  #         access_key_id: "env:SOKAR_S3_ACCESS_KEY"
  #         secret_access_key: "env:SOKAR_S3_SECRET_KEY"
  stores: []

  # A Secret whose keys are exposed as env vars to the sokard container via
  # envFrom, so `options` entries like `access_key_id = "env:SOKAR_S3_ACCESS_KEY"`
  # resolve at runtime. The chart does not create this Secret — provision it
  # out-of-band (or via an external-secrets controller) and reference it here.
  storeSecrets:
    existingSecret: ""

  # [[principal]] entries. Each needs exactly one of tokenFile/tokenSha256File
  # (mirrors crates/sokar/src/config.rs's PrincipalConfig). The default entry
  # points at the ingress-auth Secret mounted below, matching akhomed/seshd's
  # shared bearer token. NOTE: unlike the akhomed/seshd shared-secret file
  # (which accepts multiple newline-separated tokens for rotation), sokar's
  # PrincipalConfig accepts exactly one token with no embedded whitespace —
  # if ingressAuth's Secret ever holds more than one line, split the tokens
  # into per-principal files of your own instead of reusing this mount.
  principals:
    - id: fleet
      tokenFile: /etc/sokar/token

  # Sokar's own Postgres-backed idempotency index. Separate database/user
  # from seshd's (default "sokar"/"sokar") on the same PostgreSQL host —
  # when using the bundled `postgresql` subchart, that instance only
  # provisions the `seshat` role/database out of the box, so add a `sokar`
  # role + database via `postgresql.primary.initdb.scripts` (or point
  # `database.user`/`database.name` at the existing `seshat` role) before
  # enabling sokard against it.
  database:
    # sokar's [database] is optional (crates/sokar/src/config.rs): omitting
    # it runs an ephemeral in-memory index that is rebuilt from the store
    # manifests on every restart (fine for a single non-HA replica; loses
    # idempotency records across restarts and cannot be shared across
    # replicas). Set false to render sokar.toml with no [database] section
    # at all instead of building one from url/existingSecret/externalPostgresql.
    enabled: true
    # Explicit DATABASE_URL secret reference (as a literal connection
    # string). Takes priority over existingSecret/host-derived construction.
    url: ""
    # Reference an existing Secret containing the `secretKey` below instead
    # of letting the chart build one from externalPostgresql.*.
    existingSecret: ""
    secretKey: "SOKAR_DATABASE_URL"
    name: "sokar"
    user: "sokar"

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# ── transcripts (agent-session transcript harvest, ADR 119) ───────────────
# Off by default: needs harvest-pg (a dedicated CNPG cluster, not the
# postgresql/externalPostgresql above) and its per-role client-cert Secrets
# provisioned first — see docs/wayfinder/transcript-harvest/. This chart only
# deploys the two in-cluster components (akh-derive, akh-transcripts-mcp);
# akh-harvest is thin and runs per-machine outside Kubernetes entirely
# (ingest-transport.md), so it has no template here.
transcripts:
  enabled: false

  image:
    repository: code.aopc.cloud/toasterson/akh-transcripts
    tag: ""  # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent

  # The baked-in ONNX model asset makes this image amd64-only, same reasoning
  # as seshd.
  nodeSelector:
    kubernetes.io/arch: amd64
  tolerations: []
  affinity: {}
  podAnnotations: {}

  env:
    RUST_LOG: "akh_transcripts=info"

  derive:
    replicaCount: 1
    intervalSecs: 30
    batchSize: 200
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

  mcp:
    replicaCount: 1
    bind: "0.0.0.0:9500"
    service:
      type: ClusterIP
      port: 9500
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 768Mi

  # Postgres — mTLS only. harvest-pg's pg_hba is
  #   hostnossl transcripts all all reject
  #   hostssl   transcripts all all cert clientcert=verify-full
  # so there is no password path at all for this database; every connection,
  # including migrations, authenticates with a client certificate. The DSN is
  # assembled by the deployment templates from the fields below rather than
  # built from a chart-managed Secret, because there is no password to carry.
  #
  # `harvest-pg-rw.akh-medu.svc` verified live via
  # `kubectl get svc -n akh-medu` during packaging (2026-09-19) — it is the
  # CNPG read-write Service for the harvest-pg cluster.
  database:
    host: harvest-pg-rw.akh-medu.svc
    port: 5432
    name: transcripts
    sslmode: verify-full
    # Client-cert Secrets created out-of-band by whatever provisions
    # harvest-pg's Certificate resources (docs/wayfinder/transcript-harvest);
    # each holds ca.crt/tls.crt/tls.key. Mounted read-only at certMountPath —
    # libpq refuses a group/world-readable private key, so tls.key must land
    # at mode 0400 owned by the container's runAsUser (see
    # transcripts-derive-deployment.yaml / transcripts-mcp-deployment.yaml).
    certMountPath: /etc/harvest-pg
    derive:
      user: harvest_derive
      certSecret: harvest-pg-client-harvest-derive
    read:
      user: harvest_read
      certSecret: harvest-pg-client-harvest-read
    # The migrate initContainer authenticates as the database OWNER
    # (harvest), not harvest_derive, and mounts its cert at a separate path
    # from the main container's. Reason: the store's default privileges are
    # declared `FOR ROLE harvest`, so tables must be *created by* harvest for
    # harvest_derive and harvest_read to receive their grants automatically —
    # a table created by a role that merely has harvest's grants (e.g. via
    # `GRANT harvest TO harvest_derive`) would not trigger those default
    # privileges. No manual GRANT is needed; the owner cert already exists.
    owner:
      user: harvest
      certSecret: harvest-pg-client-harvest
    ownerCertMountPath: /etc/harvest-pg-owner

  # AKH_TRANSCRIPTS_BEARER_TOKEN_FILE (akh-transcripts-mcp only). Mounted the
  # same shape as sokard mounts its ingress token (a single Secret key
  # projected to one file via subPath, mountPath == the file itself), but
  # from the akhomed-shared-secret Secret already used by akhomed's ACP/TCP
  # clients — not this chart's generic `ingressAuth` Secret — so the read MCP
  # surface accepts the same bearer token the rest of the fleet already
  # carries. Existence and key verified live via
  # `kubectl get secret -n akh-medu akhomed-shared-secret` during packaging
  # (2026-09-19): type Opaque, single key AKHOMED_SHARED_SECRET.
  bearerToken:
    existingSecret: akhomed-shared-secret
    secretKey: AKHOMED_SHARED_SECRET
    mountPath: /etc/akh-transcripts/token

# ── External PostgreSQL ───────────────────────────────────────────────────
# Use this when postgresql.enabled=false to point at an existing instance.
externalPostgresql:
  host: ""
  port: 5432
  database: seshat
  username: seshat
  # Password: set via --set or reference an existing secret.
  password: ""
  # If set, the password is read from this secret instead.
  existingSecret: ""
  existingSecretKey: "password"

# ── PostgreSQL (Bitnami subchart) ─────────────────────────────────────────
# Set enabled=false and configure externalPostgresql above to use
# an existing PostgreSQL installation.
postgresql:
  enabled: true
  auth:
    database: seshat
    username: seshat
    # Set via --set or external secret.
    password: ""
    existingSecret: ""
  primary:
    # Enable pgvector extension.
    initdb:
      scripts:
        enable-pgvector.sql: |
          CREATE EXTENSION IF NOT EXISTS vector;
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    # Pin PostgreSQL to the same architectures as akhomed/seshd
    # (pgvector/pgvector is multi-arch so this just mirrors our policy).
    nodeAffinityPreset:
      type: "hard"
      key: "kubernetes.io/arch"
      values:
        - amd64
  image:
    registry: docker.io
    repository: pgvector/pgvector
    tag: "pg16"

# ── Image pull secrets ────────────────────────────────────────────────────
imagePullSecrets: []
