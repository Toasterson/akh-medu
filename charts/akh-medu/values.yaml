# ── Global ─────────────────────────────────────────────────────────────────
global:
  imageRegistry: ""
  # Allow non-Bitnami pgvector image (required for pgvector/pgvector).
  security:
    allowInsecureImages: true

# CPU architectures for which akhomed and seshd images have been built.
# Pods are pinned to nodes matching one of these via required nodeAffinity
# on `kubernetes.io/arch`. Add "arm64" here only after publishing arm64 images.
supportedArchitectures:
  - amd64

# ── akhomed (akh-medu daemon) ──────────────────────────────────────────────
akhomed:
  enabled: true
  replicaCount: 1

  image:
    repository: code.aopc.cloud/toasterson/akhomed
    tag: ""  # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8201

  # ACP transport — the daemon's only inbound surface (ADR-061). TCP must bind
  # 0.0.0.0 (not the config default 127.0.0.1) so the kubelet probe and the
  # Service can reach it. Injected as AKH_ACP_TCP_{PORT,BIND} env (see deployment).
  acp:
    tcpPort: 8201
    tcpBind: "0.0.0.0"

  # Environment variables passed to akhomed. (Data/config/state paths come from
  # the XDG_* env set in the deployment template; ACP TCP from `acp` above.)
  env:
    AKH_AUTO_START: "default"
    RUST_LOG: "info"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4317"
    OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
    OTEL_SERVICE_NAME: "akhomed"
    OTEL_RESOURCE_ATTRIBUTES: "service.namespace=akh-medu,deployment.environment=prod"
    OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
    OTEL_TRACES_SAMPLER_ARG: "0.1"

  # Persistent volume for engine data (KG, HNSW, redb).
  persistence:
    enabled: true
    storageClass: ""
    size: 30Gi
    accessModes:
      - ReadWriteOnce

  # NLU models volume (ONNX NER model, LLM GGUF, Candle models).
  models:
    enabled: true
    storageClass: ""
    size: 5Gi
    accessModes:
      - ReadWriteOnce

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Probes verify the ACP TCP listener is accepting connections — there is no
  # HTTP surface anymore (ADR-061), so the old httpGet /status probe could never
  # pass.
  probes:
    liveness:
      tcpSocket:
        port: acp
      initialDelaySeconds: 10
      periodSeconds: 30
    readiness:
      tcpSocket:
        port: acp
      initialDelaySeconds: 5
      periodSeconds: 10

  # ── Remote exec backend (ADR 082 / Phase 48c wiring) ─────────────────────
  # Optional SSH key + known_hosts mounted into the akhomed pod so an
  # arm64 node that cannot compile locally can route shell_exec/file_io to a
  # real build host (e.g. `armini`) over SSH. Per-workspace `[exec]` sections
  # in akh.toml reference these mounted paths (`key` / `known_hosts`).
  # Leave `sshKey.enabled = false` (the default) for workspaces that run
  # in-process — no volume is mounted and behaviour is unchanged.
  sshKey:
    enabled: false
    # Mount path inside the container. akh.toml's `[exec] key`/`known_hosts`
    # should point under this directory.
    mountPath: /etc/akh/ssh
    # The SSH private key (OpenSSH format, unencrypted — ADR 086 §1). Set
    # inline here for dev/eval; for anything real, use `existingSecret` to
    # reference a pre-provisioned secret you manage out-of-band. The secret
    # is mounted read-only and (when created here) chmod'd via an init
    # container to 0600 so other local users on the node can't read it.
    existingSecret: ""
    # Inline key material (used only when `existingSecret` is empty). The
    # chart creates a Secret from this; leave it empty to skip creation.
    privateKey: ""
    # Inline known_hosts file content. Mounted as a ConfigMap at
    # `<mountPath>/known_hosts`. Empty ⇒ no known_hosts is mounted (the
    # russh default `~/.ssh/known_hosts` is used instead — fine when HOME
    # is set, but typically you want an explicit known_hosts in a pod).
    knownHosts: ""

# ── seshd (Seshat's Archive) ──────────────────────────────────────────────
seshd:
  enabled: true
  replicaCount: 1

  image:
    repository: code.aopc.cloud/toasterson/seshd
    tag: ""  # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 9090

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: seshat.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

  env:
    RUST_LOG: "seshat=info"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4317"
    OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
    OTEL_SERVICE_NAME: "seshd"
    OTEL_RESOURCE_ATTRIBUTES: "service.namespace=akh-medu,deployment.environment=prod"
    OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
    OTEL_TRACES_SAMPLER_ARG: "0.1"

  # Seshat config (rendered as ConfigMap → mounted at /config/seshat.toml).
  config:
    database:
      # When empty AND postgresql.enabled=true, the URL is auto-constructed
      # from the subchart. Set this to use an external PostgreSQL instance.
      url: ""
      maxConnections: 10
    embedding:
      model: "all-MiniLM-L6-v2"
      batchSize: 32
      pollIntervalSecs: 30
    server:
      bind: "0.0.0.0:9090"
      transport: "streamable-http"
    synthesis:
      enabled: false
      backend: "candle"
      modelPath: ""
      maxTriples: 30

  # Models volume for embedding ONNX + synthesis GGUF models.
  models:
    enabled: true
    storageClass: ""
    size: 2Gi
    accessModes:
      - ReadWriteOnce

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

  nodeSelector: {}
  tolerations: []
  affinity: {}

  probes:
    # rmcp's streamable-http transport returns 406 to a plain GET /mcp
    # (it needs `accept: text/event-stream`), so a plain httpGet probe
    # on /mcp fails. Use tcpSocket to just verify the listener is open.
    # Once seshd grows a proper /healthz endpoint, this can flip back
    # to httpGet. NOTE: kube probe schema forbids multiple handler
    # types on the same probe, so an HR that overrides with `httpGet`
    # must either null out `tcpSocket` or (better) the chart template
    # needs a handler-exclusive render. Keeping the default aligned
    # with the production HR avoids the deep-merge foot-gun.
    liveness:
      tcpSocket:
        port: http
      initialDelaySeconds: 15
      periodSeconds: 30
    readiness:
      tcpSocket:
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10

# ── External PostgreSQL ───────────────────────────────────────────────────
# Use this when postgresql.enabled=false to point at an existing instance.
externalPostgresql:
  host: ""
  port: 5432
  database: seshat
  username: seshat
  # Password: set via --set or reference an existing secret.
  password: ""
  # If set, the password is read from this secret instead.
  existingSecret: ""
  existingSecretKey: "password"

# ── PostgreSQL (Bitnami subchart) ─────────────────────────────────────────
# Set enabled=false and configure externalPostgresql above to use
# an existing PostgreSQL installation.
postgresql:
  enabled: true
  auth:
    database: seshat
    username: seshat
    # Set via --set or external secret.
    password: ""
    existingSecret: ""
  primary:
    # Enable pgvector extension.
    initdb:
      scripts:
        enable-pgvector.sql: |
          CREATE EXTENSION IF NOT EXISTS vector;
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    # Pin PostgreSQL to the same architectures as akhomed/seshd
    # (pgvector/pgvector is multi-arch so this just mirrors our policy).
    nodeAffinityPreset:
      type: "hard"
      key: "kubernetes.io/arch"
      values:
        - amd64
  image:
    registry: docker.io
    repository: pgvector/pgvector
    tag: "pg16"

# ── Image pull secrets ────────────────────────────────────────────────────
imagePullSecrets: []
