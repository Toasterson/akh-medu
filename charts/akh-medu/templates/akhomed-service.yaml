{{- if .Values.akhomed.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "akh-medu.fullname" . }}-akhomed
  labels:
    {{- include "akh-medu.akhomed.labels" . | nindent 4 }}
spec:
  type: {{ .Values.akhomed.service.type }}
  ports:
    - port: {{ .Values.akhomed.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "akh-medu.akhomed.selectorLabels" . | nindent 4 }}
{{- end }}
