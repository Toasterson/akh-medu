{{- if and (not .Values.ingressAuth.existingSecret) .Values.ingressAuth.sharedSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "akh-medu.ingressAuth.secretName" . }}
  labels:
    {{- include "akh-medu.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.ingressAuth.secretKey | default "tokens" }}: |-
    {{- .Values.ingressAuth.sharedSecret | nindent 4 }}
    {{- with .Values.ingressAuth.previousSharedSecret }}
    {{- . | nindent 4 }}
    {{- end }}
{{- end }}
