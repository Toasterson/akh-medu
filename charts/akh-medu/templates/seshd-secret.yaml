{{- if .Values.seshd.enabled }}
{{- /* Skip creating the secret when the user provides an explicit database URL or an existing secret. */ -}}
{{- $explicitUrl := .Values.seshd.config.database.url -}}
{{- $existingSecret := "" -}}
{{- if not .Values.postgresql.enabled -}}
{{-   $existingSecret = .Values.externalPostgresql.existingSecret -}}
{{- end -}}
{{- if and (not $explicitUrl) (not $existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "akh-medu.fullname" . }}-seshd-db
  labels:
    {{- include "akh-medu.seshd.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: "postgres://{{ include "akh-medu.postgresql.username" . }}:{{ include "akh-medu.postgresql.password" . }}@{{ include "akh-medu.postgresql.host" . }}:{{ include "akh-medu.postgresql.port" . }}/{{ include "akh-medu.postgresql.database" . }}"
{{- end }}
{{- end }}
