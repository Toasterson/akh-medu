{{- if and .Values.akhomed.enabled .Values.akhomed.sshKey.enabled (not .Values.akhomed.sshKey.existingSecret) }}
# SSH key material for the akhomed remote-exec backend (ADR 082 / Phase 48c).
# Created from inline values only when `sshKey.enabled = true` AND no
# `existingSecret` is named — operators who manage the secret themselves
# (the recommended path) point `existingSecret` at it and this template
# stays empty. The key is mounted read-only into the pod at `sshKey.mountPath`.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "akh-medu.fullname" . }}-akhomed-ssh-key
  labels:
    {{- include "akh-medu.akhomed.labels" . | nindent 4 }}
type: Opaque
stringData:
  # The private key (OpenSSH format, unencrypted — ADR 086 §1).
  id_ed25519: |-
    {{- .Values.akhomed.sshKey.privateKey | nindent 4 }}
{{- end }}