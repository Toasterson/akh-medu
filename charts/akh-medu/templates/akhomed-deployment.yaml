{{- if .Values.akhomed.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "akh-medu.fullname" . }}-akhomed
  labels:
    {{- include "akh-medu.akhomed.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.akhomed.replicaCount }}
  strategy:
    type: Recreate  # Single writer to KG data volume.
  selector:
    matchLabels:
      {{- include "akh-medu.akhomed.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "akh-medu.akhomed.selectorLabels" . | nindent 8 }}
      {{- if or .Values.akhomed.configToml .Values.akhomed.workspaces }}
      annotations:
        # Force a rollout when the config ConfigMap content changes. A
        # ConfigMap volume update propagates to the mounted files eventually
        # (kubelet sync period), but config.toml is mounted via `subPath`
        # (see the volumeMount comment below) which NEVER sees ConfigMap
        # updates at all — the file is copied in at pod creation and frozen.
        # Bumping this annotation on every content change is what actually
        # rolls the pod.
        checksum/akh-config: {{ include (print $.Template.BasePath "/akhomed-config-configmap.yaml") . | sha256sum }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.akhomed.terminationGracePeriodSeconds | default 30 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The runtime image declares `USER akh` by NAME. The kubelet cannot
      # verify a non-numeric user is non-root, so `runAsNonRoot: true` alone
      # fails the container with "image has non-numeric user (akh), cannot
      # verify user is non-root". Pin the numeric ids explicitly.
      #
      # akh is uid 999 / gid 999 in the image (`id akh` in
      # docker/akhomed.Dockerfile's runtime stage). fsGroup MUST match that
      # gid or the mounted PVCs are group-owned by a group the process is not
      # in, and akhomed cannot write its own data volume.
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.akhomed.securityContext.runAsUser | default 999 }}
        runAsGroup: {{ .Values.akhomed.securityContext.runAsGroup | default 999 }}
        fsGroup: {{ .Values.akhomed.securityContext.fsGroup | default 999 }}
      containers:
        - name: akhomed
          image: {{ include "akh-medu.akhomed.image" . }}
          imagePullPolicy: {{ .Values.akhomed.image.pullPolicy }}
          ports:
            - name: acp
              containerPort: {{ .Values.akhomed.acp.tcpPort | default 8201 }}
              protocol: TCP
          env:
            {{- range $key, $val := .Values.akhomed.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            # All akh dirs live on the mounted /data PVC. akhomed resolves paths
            # via XDG_* (+ HOME); it never read the old AKH_HOME.
            - name: HOME
              value: /data
            - name: XDG_DATA_HOME
              value: /data
            - name: XDG_CONFIG_HOME
              value: /data/config
            - name: XDG_STATE_HOME
              value: /data/state
            - name: XDG_RUNTIME_DIR
              value: /data/run
            # Enable + bind the ACP TCP listener (see values `akhomed.acp`).
            - name: AKH_ACP_TCP_PORT
              value: {{ .Values.akhomed.acp.tcpPort | quote }}
            - name: AKH_ACP_TCP_BIND
              value: {{ .Values.akhomed.acp.tcpBind | quote }}
            # OTLP service instance ID from the pod name.
            - name: OTEL_SERVICE_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Extras render AFTER the built-ins above so `$(VAR)` references
            # inside an extraEnv entry can expand an earlier extraEnv entry
            # in list order (e.g. DATABASE_URL composed from a Secret-injected
            # password: PGPASSWORD from secretKeyRef, then DATABASE_URL =
            # "postgres://user:$(PGPASSWORD)@host/db" referencing it).
            {{- with .Values.akhomed.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.akhomed.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.akhomed.models.enabled }}
            # akhomed reads models from $XDG_DATA_HOME/akh-medu/models.
            - name: models
              mountPath: /data/akh-medu/models
            {{- end }}
            {{- if .Values.akhomed.sshKey.enabled }}
            # SSH key + known_hosts for the remote-exec backend (ADR 082 /
            # Phase 48c). Mounted read-only; per-workspace `[exec]` sections
            # in akh.toml point `key`/`known_hosts` under this path.
            - name: ssh-key
              mountPath: {{ .Values.akhomed.sshKey.mountPath | default "/etc/akh/ssh" }}
              readOnly: true
            {{- if .Values.akhomed.sshKey.knownHosts }}
            - name: known-hosts
              mountPath: {{ .Values.akhomed.sshKey.mountPath | default "/etc/akh/ssh" }}/known_hosts
              subPath: known_hosts
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if .Values.akhomed.configToml }}
            # subPath mounts never see ConfigMap updates — the file is copied
            # in once at pod creation, not kept live-synced like a whole-dir
            # mount. The checksum/akh-config annotation on the pod template
            # above is what actually rolls the pod on a content change.
            - name: akh-config
              mountPath: /data/config/akh-medu/config.toml
              subPath: config.toml
              readOnly: true
            {{- end }}
            {{- if .Values.akhomed.workspaces }}
            # Whole-dir mount, so it stays live-synced — but that also makes
            # workspaces/ read-only as a whole. Workspace definitions here are
            # declarative; imperative `akh workspace create` against a
            # k8s-resident akhomed is not supported while this is mounted.
            - name: akh-workspaces
              mountPath: /data/config/akh-medu/workspaces
              readOnly: true
            {{- end }}
            {{- with .Values.akhomed.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.akhomed.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.akhomed.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.akhomed.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.akhomed.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "akh-medu.fullname" . }}-akhomed-data
          {{- else }}
          {{- $medium := .Values.akhomed.persistence.medium | default "" }}
          {{- $sizeLimit := .Values.akhomed.persistence.sizeLimit | default "" }}
          {{- if and (not $medium) (not $sizeLimit) }}
          # Plain emptyDir backed by the node's ephemeral storage. On a Pi
          # this is the SD card — set `persistence.medium: "Memory"` for a
          # tmpfs (see values.yaml `persistence` comment).
          emptyDir: {}
          {{- else }}
          emptyDir:
            {{- if $medium }}
            medium: {{ $medium | quote }}
            {{- end }}
            {{- if $sizeLimit }}
            sizeLimit: {{ $sizeLimit | quote }}
            {{- end }}
          {{- end }}
          {{- end }}
        {{- if .Values.akhomed.models.enabled }}
        - name: models
          persistentVolumeClaim:
            claimName: {{ include "akh-medu.fullname" . }}-akhomed-models
        {{- end }}
        {{- if .Values.akhomed.sshKey.enabled }}
        - name: ssh-key
          secret:
            secretName: {{ .Values.akhomed.sshKey.existingSecret | default (printf "%s-akhomed-ssh-key" (include "akh-medu.fullname" .)) }}
            defaultMode: 0o400
        {{- if .Values.akhomed.sshKey.knownHosts }}
        - name: known-hosts
          configMap:
            name: {{ include "akh-medu.fullname" . }}-akhomed-known-hosts
            defaultMode: 0o444
        {{- end }}
        {{- end }}
        {{- if .Values.akhomed.configToml }}
        - name: akh-config
          configMap:
            name: {{ include "akh-medu.fullname" . }}-akhomed-config
            items:
              - key: config.toml
                path: config.toml
        {{- end }}
        {{- if .Values.akhomed.workspaces }}
        - name: akh-workspaces
          configMap:
            name: {{ include "akh-medu.fullname" . }}-akhomed-config
            items:
              # Strips the "ws-" prefix (see akhomed-config-configmap.yaml)
              # so each key lands as workspaces/<name>.toml.
              {{- range $name, $toml := .Values.akhomed.workspaces }}
              - key: ws-{{ $name }}.toml
                path: {{ $name }}.toml
              {{- end }}
        {{- end }}
        {{- with .Values.akhomed.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.akhomed.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.akhomed.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- include "akh-medu.archAffinity" . | nindent 8 }}
        {{- with .Values.akhomed.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
