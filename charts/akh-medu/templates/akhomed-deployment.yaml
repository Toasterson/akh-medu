{{- if .Values.akhomed.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "akh-medu.fullname" . }}-akhomed
  labels:
    {{- include "akh-medu.akhomed.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.akhomed.replicaCount }}
  strategy:
    type: Recreate  # Single writer to KG data volume.
  selector:
    matchLabels:
      {{- include "akh-medu.akhomed.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "akh-medu.akhomed.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: akhomed
          image: {{ include "akh-medu.akhomed.image" . }}
          imagePullPolicy: {{ .Values.akhomed.image.pullPolicy }}
          ports:
            - name: acp
              containerPort: {{ .Values.akhomed.acp.tcpPort | default 8201 }}
              protocol: TCP
          env:
            {{- range $key, $val := .Values.akhomed.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            # All akh dirs live on the mounted /data PVC. akhomed resolves paths
            # via XDG_* (+ HOME); it never read the old AKH_HOME.
            - name: HOME
              value: /data
            - name: XDG_DATA_HOME
              value: /data
            - name: XDG_CONFIG_HOME
              value: /data/config
            - name: XDG_STATE_HOME
              value: /data/state
            - name: XDG_RUNTIME_DIR
              value: /data/run
            # Enable + bind the ACP TCP listener (see values `akhomed.acp`).
            - name: AKH_ACP_TCP_PORT
              value: {{ .Values.akhomed.acp.tcpPort | quote }}
            - name: AKH_ACP_TCP_BIND
              value: {{ .Values.akhomed.acp.tcpBind | quote }}
            # OTLP service instance ID from the pod name.
            - name: OTEL_SERVICE_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.akhomed.models.enabled }}
            # akhomed reads models from $XDG_DATA_HOME/akh-medu/models.
            - name: models
              mountPath: /data/akh-medu/models
            {{- end }}
          {{- with .Values.akhomed.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.akhomed.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.akhomed.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.akhomed.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "akh-medu.fullname" . }}-akhomed-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.akhomed.models.enabled }}
        - name: models
          persistentVolumeClaim:
            claimName: {{ include "akh-medu.fullname" . }}-akhomed-models
        {{- end }}
      {{- with .Values.akhomed.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.akhomed.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- include "akh-medu.archAffinity" . | nindent 8 }}
        {{- with .Values.akhomed.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
