{{- if and .Values.sokard.enabled .Values.sokard.database.enabled }}
{{- /* Skip creating the secret when the user provides an explicit database URL or an existing secret. */ -}}
{{- $explicitUrl := .Values.sokard.database.url -}}
{{- $existingSecret := .Values.sokard.database.existingSecret -}}
{{- if and (not $explicitUrl) (not $existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "akh-medu.fullname" . }}-sokard-db
  labels:
    {{- include "akh-medu.sokard.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.sokard.database.secretKey | default "SOKAR_DATABASE_URL" }}: "postgres://{{ .Values.sokard.database.user | default "sokar" }}:{{ include "akh-medu.postgresql.password" . }}@{{ include "akh-medu.postgresql.host" . }}:{{ include "akh-medu.postgresql.port" . }}/{{ .Values.sokard.database.name | default "sokar" }}"
{{- end }}
{{- end }}
