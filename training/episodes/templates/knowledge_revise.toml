# Phase 51 P6.5 — knowledge_revise (E4 revision curriculum) phrasing.
#
# Data-only file (see memory_write.toml header for the rule this follows).
# Distinct from oracle.toml's `oracle_revise` (P6.3, plain `remove_triple`):
# these episodes exercise the exact-owned edge retraction path recovered in
# P6.0 (`Engine::retract_owned_rule_snapshot`, `tests/exact_owned_revision.rs`).
#
# Placeholders: {job} {old_worker} {new_worker}
schema_version = 1

[[template]]
family = "knowledge_revise"
kind = "revise"
language = "en"
text = "A correction arrived for \"{job}\": the current worker is no longer \"{old_worker}\", it is now \"{new_worker}\". Retract the superseded assignment and record the corrected one."
