[package]
name = "grug-data"
version = "0.1.0"
edition = "2024"
description = "Phase 51 (Grug-Brain BabyLLM): programmatic tool-calling data generator + eval scorer. No ML dependency."
license = "GPL-3.0-only"
repository = "https://github.com/Toasterson/akh-medu"

[dependencies]
# Error handling (miette + thiserror per project convention)
miette = { version = "7", features = ["fancy"] }
thiserror = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Deterministic PRNG for the data generator (seeded, NOT an ML dependency)
rand = { version = "0.8", features = ["std", "std_rng"] }

# Reproducible text-vision bootstrap. The font8x8 bitmaps are compiled into
# the generator, avoiding OS font/rasterizer drift; PNG is only the artifact
# boundary, not a vision/ML dependency.
font8x8 = { version = "0.3", features = ["unicode"] }
png = "0.18"
unicode-normalization = "0.1"

[dev-dependencies]
