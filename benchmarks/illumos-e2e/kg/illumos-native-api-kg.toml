# illumos native-API knowledge graph — ATOMIC triples (v2 of the fixture).
#
# WHY THIS EXISTS: the first fixture (illumos-native-api.toml) crammed whole
# English sentences into the object *label* of each triple, so KG grounding
# rendered prose. That is not a knowledge graph — it is RAG hidden in a label
# field, and it did not help (glm-5.2 8/15 < 10/15 baseline; see
# benchmarks/results/2026-07-08-illumos-e2e-glm-5.2-harness).
#
# This version is a genuine graph: every subject AND object is an ATOMIC term
# (an API, a tool, a field, a mechanism), joined by atomic relations. The
# knowledge lives in the TOPOLOGY — shared hub nodes (`extern-C-FFI`,
# `CLI-tool`, `illumos`, `zfs set`, `usermod -K`, `rights-profile`, `dladm`)
# are reached from many subjects, so a keyword match surfaces a *cluster* of
# short facts the model must compose (e.g. keywords cpu/clock/psrinfo pull
# `clock from pi_clock`, `pi_clock field-of processor_info`,
# `processor_info is-a illumos-syscall`, `illumos-syscall called-via
# extern-C-FFI`, `processor_info instead-of psrinfo`).
#
# HONESTY CONTRACT (unchanged): general illumos knowledge only — which native
# primitive, which CLI it replaces, how it is invoked. No task instance names,
# property values, role names, or verify.sh checks. src/nlu/kg_context.rs
# renders each as "subject predicate object"; collect_relevant_triples takes
# up to 3 outgoing + 3 incoming edges per keyword-matched node.

