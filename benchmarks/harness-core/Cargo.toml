[package]
name = "harness-core"
version = "0.1.0"
edition = "2024"
description = "Phase 50 (W7): benchmark results schema, storage, leaderboard, and self-contained HTML site generator"
license = "GPL-3.0-only"
repository = "https://github.com/Toasterson/akh-medu"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
blake3 = { version = "1" }
walkdir = "2"
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "bench-tool"
path = "src/bin/bench_tool.rs"
