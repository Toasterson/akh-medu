[workspace]
members = [
    ".",
    "crates/seshat",
    "crates/heka",
    "crates/shend",
    "crates/anima-ai",
    "crates/akhomed-store",
    "crates/akh-egraph-bench",
    "crates/grug-data",
    "crates/grug-train",
    "benchmarks/harness-core",
    "crates/akh-session-types",
    "crates/akh-service-store",
    "crates/akh-runtime",
    "crates/akh-session-services",
]
resolver = "3"

[package]
name = "akh-medu"
version = "0.8.0"
edition = "2024"
description = "Neuro-symbolic AI engine: VSA + knowledge graphs + symbolic reasoning"
license = "GPL-3.0-only"
repository = "https://github.com/Toasterson/akh-medu"
homepage = "https://akh-medu.dev"
readme = "README.md"
keywords = ["ai", "knowledge-graph", "vsa", "reasoning", "neuro-symbolic"]
categories = ["science", "algorithms", "command-line-utilities"]

# cargo-binstall: fetch the prebuilt lean `akh` client from Forgejo releases
# instead of compiling. Only `akh` is binstalled — `akhomed` is excluded by its
# `required-features = ["server"]` and `generate_qa_dataset` by
# `required-features = ["training-data"]`, so neither is in the default bin set.
# The release workflow uploads `akh-{version}-{target}.tar.gz` (the binary at the
# archive root) per target. The tag is `v{version}`, hence `v{ version }` below.
[package.metadata.binstall]
# Literal `.tar.gz` (not `{ archive-suffix }`, which is `.tgz` for pkg-fmt=tgz)
# to match the asset name produced by packaging/build-binstall-archive.sh.
pkg-url = "https://code.aopc.cloud/toasterson/akh-medu/releases/download/v{ version }/akh-{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[dependencies]
# Error handling
miette = { version = "7", features = ["fancy"] }
thiserror = "2"

# Note: We implement our own VSA operations with SIMD kernels
# rather than depending on `hypervector` and `bitvector_simd` which
# have compatibility issues with stable Rust toolchains.

# Symbolic reasoning
egg = "0.11"

# Storage
memmap2 = "0.9"
redb = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
toml = "0.8"
# Typed board identifiers for the Djehuty Board client (agent::djehuty).
# Lockfile already pins uuid 1.23.4 via akhomed-store; `v7` provides the
# time-ordered id generation the board itself uses.
uuid = { version = "1", features = ["v7", "serde"] }

# Concurrency
dashmap = "6"
rayon = "1"

# Search & Graphs
hnsw_rs = "0.3"
anndists = "0.1"
petgraph = "0.7"
oxigraph = { version = "0.5", default-features = false }

# Code analysis
syn = { version = "2", features = ["full", "visit"] }
quote = "1"

# Document parsing
scraper = "0.23"
pdf-extract = "0.10"
epub = "2"

# HTTP (sync)
ureq = { version = "2", features = ["json"] }

# MCP protocol version vocabulary (`ProtocolVersion`, `KNOWN_VERSIONS`) for the
# hand-rolled Streamable HTTP client in `src/upstream_client.rs` — reuses
# rmcp's own negotiation types instead of hand-rolling a version list.
# `default-features = false` pulls in only the base model/schema types, not
# rmcp's client/server/macro machinery (that would duplicate what our
# hand-rolled transport already does). Already in the lockfile at this exact
# version via `crates/seshat`'s `rmcp = { features = ["server", ...] }`, so
# this adds no new/duplicate version to the tree. Unconditional, matching
# `upstream_client`'s own unconditional module (not gated behind a feature).
rmcp = { version = "0.17", default-features = false }

# Process management (Unix PID checks)
libc = "0.2"

# Unicode
unicode-normalization = "0.1"

# Numeric
rand = "0.8"

# TUI
ratatui = "0.29"
crossterm = "0.28"
signal-hook = "0.3"

# Infrastructure
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }

# Phase 38i/38j.1: OpenTelemetry OTLP tracing + metrics skeleton. Exact-pinned
# per research §2.1 so all five crates move in lockstep on Renovate bumps
# (no double-versions). Optional + feature-gated so the lean `akh` client
# binary (default-features build) links zero OTel crates.
opentelemetry = { version = "=0.27", optional = true }
opentelemetry_sdk = { version = "=0.27", features = ["rt-tokio", "metrics"], optional = true }
opentelemetry-otlp = { version = "=0.27", features = ["grpc-tonic", "trace", "metrics"], optional = true }
tracing-opentelemetry = { version = "=0.28", optional = true }
opentelemetry-semantic-conventions = { version = "=0.27", features = ["semconv_experimental"], optional = true }

# Async runtime (feature-gated; shared by the daemon and the ACP server)
tokio = { version = "1", features = ["full"], optional = true }
akh-session-types = { path = "crates/akh-session-types" }
akh-runtime = { path = "crates/akh-runtime", optional = true }
akh-service-store = { path = "crates/akh-service-store", optional = true }
axum = { version = "0.8", optional = true }

# Stream combinators for the oxifed federation channel (feature-gated)
futures-util = { version = "0.3", optional = true }

# WASM tool runtime (feature-gated)
wasmtime = { version = "29", features = ["component-model"], optional = true }

# Federation via oxifed (feature-gated)
lapin = { version = "2", optional = true }
deadpool-lapin = { version = "0.12", optional = true }

# Email channel (feature-gated)
mail-parser = { version = "0.11", optional = true }
imap = { version = "2", optional = true }
native-tls = { version = "0.2", optional = true }
lettre = { version = "0.11", optional = true, default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
regex = "1"

# ELIZA hot-reload (feature-gated)
notify = { version = "6", optional = true }
knuffel = { version = "3", optional = true }

# Archive extraction (for ONNX Runtime setup)
flate2 = "1"
tar = "0.4"

# NLU Tier 2: Micro-ML NER (feature-gated)
ort = { version = "=2.0.0-rc.11", optional = true, default-features = false, features = ["std", "load-dynamic"] }
tokenizers = { version = "0.22", optional = true, default-features = false, features = ["progressbar", "fancy-regex"] }

# NLU Tier 3: Small LLM translator (feature-gated)
llama-cpp-2 = { version = "0.1", optional = true, features = ["sampler"] }
encoding_rs = { version = "0.8", optional = true }

# NLU Candle backend: GGUF inference with hidden state access (feature-gated)
candle-core = { version = "0.10", optional = true }
candle-nn = { version = "0.10", optional = true }
candle-transformers = { version = "0.10", optional = true }
safetensors = { version = "0.7", optional = true }

# Candle audio-native boundary (Gemma 4, ADR 069): 16 kHz mono WAV decode.
hound = "3"
# AMD GPU backend (ROCm/HIP, ADR 068): dlopen the HIP dequant kernel + rocBLAS.
# Optional — only pulled under the `rocm` feature; off by default so CPU-only
# and non-AMD hosts build clean.
libloading = { version = "0.8", optional = true }

# Training: Burn framework for LoRA fine-tuning (future, feature-gated)
# NOTE: Burn 0.21-pre.3's burn-dataset pulls rusqlite→libsqlite3-sys 0.35
# which conflicts with seshat's sea-orm→sqlx→libsqlite3-sys 0.26.
# Deferred until Burn reaches stable release with decoupled dataset crate.
# burn = { version = "0.21", optional = true, default-features = false, features = ["train", "ndarray", "std"] }

# Phase 38: Postgres-backed durable store for relocatable Akhs (feature-gated).
# Pulled in only under the `postgres` feature (folded into `server`), so the
# lean `akh` client binary never compiles SeaORM/sqlx.
akhomed-store = { path = "crates/akhomed-store", optional = true }

# Phase 51 / ADR 089: the organ's tool-call passes (retrieval-scoped catalog +
# KG-repair of near-miss calls) at the live agent boundary. Pure Rust, no ML
# dependency — the tested lab implementation, reused rather than reimplemented.
grug-data = { path = "crates/grug-data" }
# The from-scratch BabyLLM runtime is opt-in so lean clients and existing
# Candle/Ollama deployments do not pay Burn's compile/runtime cost.
grug-train = { path = "crates/grug-train", optional = true }

# Calendar (feature-gated)
icalendar = { version = "0.16", optional = true, features = ["parser"] }
chrono = { version = "0.4", optional = true, features = ["serde"] }
cron = { version = "0.17", optional = true }

# Akhipedia wiki (feature-gated)
comrak = { version = "0.31", optional = true, default-features = false, features = ["syntect"] }
syntect = { version = "5", optional = true }
minijinja = { version = "2", optional = true }
tantivy = { version = "0.22", optional = true }
# Unconditional since ADR 081: the stable triple-identity hash (schema/identity
# prefactor) uses blake3 in the core engine, not only in the wiki feature.
blake3 = { version = "1" }
agent-client-protocol = { version = "0.14.0", optional = true }

# ACP spike (P0): Unix-socket transport for the Agent Client Protocol.
# `agent-client-protocol` is `futures`-based; we bridge tokio's UnixStream
# halves into `futures::io::{AsyncRead,AsyncWrite}` via `tokio_util::compat`.
tokio-util = { version = "0.7", features = ["compat"], optional = true }
futures = { version = "0.3", optional = true }
# Phase 48c (ADR 082): pure-Rust SSH for the `RemoteBackend` executor. `ring`
# (not the default `aws-lc-rs`) is the crypto backend because `ring` is
# already in the dependency tree via `lettre`'s `rustls-tls` — no new crypto
# stack to vet/build. `rsa` is enabled because provisioned lab keys are
# commonly RSA; `flate2`/`serde` stay off (unneeded).
russh = { version = "0.62.1", default-features = false, features = ["ring", "rsa"], optional = true }
# Encodes file-write payloads for `RemoteBackend`'s shell-command file verbs
# (base64 | openssl base64 -d over the exec channel — see src/backend/remote.rs;
# the remote-side decode uses `openssl base64 -d`, not GNU `base64 -d` — found
# missing on the illumos exec1 guest in Phase 50 W2b).
base64 = { version = "0.22.1", optional = true }

[features]
# WI-339: the default set is deliberately LEAN (no `nlu-candle`). Before this
# item, `default = ["nlu-candle", "acp"]` dragged the vendored Candle stack,
# tokenizers, and safetensors into every ordinary `cargo test`/`cargo build` —
# including akhs whose inference runs entirely on Ollama/OpenAI-compatible
# remote backends. Candle is now opt-in:
#   * local inference / Candle token counter → `nlu-candle` (or the
#     `server-candle` composite, defined below, for an akhomed daemon), and
#   * a lean-built akhomed REFUSES to start an akh whose akh.toml selects
#     `backend = "candle"` rather than silently re-routing it (see the
#     `cfg(not(feature = "candle-backend"))` arm in src/bin/akhomed.rs).
# Per-artifact profiles are documented in docs/ops/akhomed-feature-profiles.md.
default = ["acp", "embedded-runtime"]
# Compatibility for existing embedded chat; specialized core builds omit providers.
embedded-runtime = ["dep:akh-runtime"]
# Cognitive/config/storage owner only: no client ACP, external provider or executor dependency.
core-server = ["daemon", "postgres", "tracing-otel", "dep:axum", "dep:akh-service-store"]
daemon = ["tokio", "dep:chrono", "dep:cron"]
# `server` = the akhomed daemon feature set: workspace daemons + the ACP
# inbound transport. (Pre-ADR-061 it pulled axum/tower-http for REST/WS;
# those surfaces are gone, so it now just means daemon + acp.) Phase 38 folds
# in the Postgres backing store.
server = ["daemon", "acp", "postgres", "tracing-otel", "remote-executor", "embedded-runtime"]
# Phase 38i: OTLP tracing skeleton. Default-on under `server` so akhomed
# gets the OTLP layer; the lean `akh` client binary (no `server`) stays lean.
tracing-otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry", "dep:opentelemetry-semantic-conventions"]
# Phase 38a/38b: Postgres backing store. Optional at runtime (no [postgres]
# config = legacy local-only mode); this feature only controls whether the code
# is built. Pulls in `tokio` because the WAL flusher (38b) is async.
postgres = ["dep:akhomed-store", "tokio"]
oxifed = ["daemon", "lapin", "deadpool-lapin", "futures-util"]
email = ["mail-parser", "imap", "native-tls", "lettre"]
calendar = ["icalendar", "dep:chrono"]
wasm-tools = ["wasmtime"]
nlu-ml = ["ort", "tokenizers"]
nlu-llm = ["llama-cpp-2", "encoding_rs"]
nlu-full = ["nlu-ml", "nlu-llm"]
# WI-222: peer dispatch rides ACP (ADR-061 — the daemon is ACP-only over
# Unix socket/TCP; there is no HTTP surface). reqwest is dropped entirely:
# after this change nothing in the workspace references it.
delegation = ["daemon", "acp"]
candle-backend = ["candle-core", "candle-nn", "candle-transformers", "safetensors", "tokenizers"]
nlu-candle = ["candle-backend"]
# WI-339: composite daemon profile for akhomed hosts that serve Candle-backed
# akhs (in-process GGUF inference + the Candle token counter). This is THE
# artifact profile for those hosts: release.yml and
# docs/ops/akhomed-feature-profiles.md reference `server-candle`, and the lean
# `server` build refuses to start a `backend = "candle"` akh (see the
# `cfg(not(feature = "candle-backend"))` arm in src/bin/akhomed.rs).
server-candle = ["server", "candle-backend"]
# AMD GPU acceleration for the Candle backend (ADR 068). Opt-in: requires the
# ROCm toolchain to build the HIP kernel (build.rs degrades gracefully if absent)
# and an AMD GPU at runtime. Off by default — Candle runs CPU-only without it.
rocm = ["candle-backend", "dep:libloading"]
# Apple Metal GPU acceleration for the Candle backend (Apple Silicon — e.g. the
# Mac mini). Enables candle's Metal device; the backend selects it at runtime via
# the `#[cfg(feature = "metal")]` path in candle_backend.rs. macOS/arm64 only —
# do not enable on Linux (candle's Metal backend won't compile there).
metal = ["candle-backend", "candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
# Phase 45 / ADR 073: full Candle Device::Hip backend. Enables the vendored
# candle-core HIP backend (fills the cuda module slot — see vendor/candle-core)
# on top of the `rocm` dlopen runtime (nlu::hip). Off by default; superset of rocm.
hip = ["rocm", "candle-core/hip"]
burn-training = ["candle-backend"]  # will add "burn" when sqlite3 conflict resolved
grug-backend = ["dep:grug-train"]
training-data = []
wiki = ["dep:comrak", "dep:syntect", "dep:minijinja", "dep:tantivy"]
sparql-persist = ["oxigraph/rocksdb"]
# Phase 32: LLM knowledge elicitation via T5 Knowledge model (Phase 35 provides
# the model weights; this gate enables the elicitation code path).
# Requires candle-backend. Gracefully degrades to web-API-only without the
# t5-knowledge-q6k.gguf model file.
knowledge-bootstrap = ["candle-backend"]
eliza = ["daemon", "dep:notify", "dep:knuffel"]
agent-client-protocol = ["dep:agent-client-protocol"]
# Phase P0 spike: ACP agent over a Unix domain socket, wrapping ChatProcessor
# for one in-process workspace. Additive and OFF by default — does not touch
# REST/WS/MCP transports. See src/acp/mod.rs and ADR-027 (concurrency invariant).
acp = ["dep:agent-client-protocol", "dep:tokio-util", "dep:futures", "dep:base64", "tokio"]
# Lean TUI/CLI client: ACP transport only, no in-process LLM/candle. `akh` is a
# pure ACP client (all engine work happens in the daemon), so it needs none of
# the nlu-candle stack. This is what ships as the binstall `akh` binary and the
# `akh` docker image:
#   cargo build --release --no-default-features --features client --bin akh
client = ["acp"]
# Phase 48c (ADR 082): the russh-backed `RemoteBackend` (src/backend/remote.rs).
# Bridges the synchronous `Backend` trait over an async SSH session; pulls in
# `tokio` for the internal runtime the sync trait methods block on. Off by
# default — in-process/local-drop backends need no SSH dependency at all.
remote-executor = ["dep:russh", "dep:base64", "tokio"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
sha2 = "0.10"
# Phase 50 / W3 runner (examples/phase50_w3_runner.rs): links the RunRecord
# schema + hashing/storage helpers. `chrono` is pulled in separately here
# (rather than relying on the optional main-crate feature that also gates
# it) because examples only see [dev-dependencies] unconditionally.
harness-core = { path = "benchmarks/harness-core" }
chrono = { version = "0.4", features = ["serde"] }

# Exact-model hardware canaries stream a 16.8 GB GGUF through SHA-256. Keep the
# digest implementation optimized even in the test profile so identity checks
# remain practical; application/test code itself stays unoptimized.
[profile.dev.package.sha2]
opt-level = 3

# Phase 51 (grug-train): an unoptimized `matrixmultiply`/`ndarray` build makes
# even a tiny (~27M parameter, `KnowledgeModelSize::Small`) real transformer
# step take minutes on CPU -- a `cargo test` integration test that trains a
# handful of real steps (e.g. `train_knowledge --remediate-from-bundle`)
# would otherwise be impractically slow. Same rationale as the `sha2`
# override above: keep the hot numeric kernels optimized in the dev/test
# profile while `grug-train`'s own code stays unoptimized (debuggable).
[profile.dev.package.matrixmultiply]
opt-level = 3

[profile.dev.package.ndarray]
opt-level = 3

[[bin]]
name = "akh"
path = "src/main.rs"

[[bin]]
name = "akhomed"
path = "src/bin/akhomed.rs"
required-features = ["daemon", "postgres"]

[[bin]]
name = "generate_qa_dataset"
path = "src/bin/generate_qa_dataset.rs"
# Training-data tooling, not a shipped binary. Gating it keeps it out of the
# default bin set so `cargo binstall akh-medu` resolves only `akh`. Build it
# with `cargo build --features training-data --bin generate_qa_dataset`.
required-features = ["training-data"]

[[bin]]
name = "akh_episode_generator"
path = "src/bin/akh_episode_generator.rs"
# Phase 51 P6.3: engine-in-the-loop episode generator. Needs the `daemon`
# feature for `agent::reactor`/`ReactorManageTool` (the reactor_manage
# blocker family). Training-data tooling, not a shipped binary.
required-features = ["daemon"]

[[bench]]
name = "vsa_ops"
harness = false

[[bench]]
name = "phase26"
harness = false

[[bench]]
name = "phase41g"
harness = false

[[bench]]
name = "vsa_rl_cycles"
harness = false

[[bench]]
name = "vsa_decide"
harness = false

# Phase 45 / ADR 073: vendored candle-core fork that adds the ROCm/HIP backend
# (gated behind candle-core's `hip` feature; no effect on the default build, which
# binds the byte-identical 0.10.2 source). candle-nn / candle-transformers from the
# registry consume this patched candle-core transparently.
[patch.crates-io]
candle-core = { path = "vendor/candle-core" }
# illumos portability fix: hnsw_rs (always-on, item-memory ANN backend) pulls
# mmap-rs unconditionally, which in turn depends on the `sysctl` crate for
# every `cfg(unix)` target even though `sysctl` implements a `sys` backend
# only for linux/android/macos/ios/tvos/visionos/freebsd — it has no illumos
# module and fails to compile there (E0432/E0433: `mod sys` "configured
# out"). Nothing mmap-rs does on illumos (which falls through to its generic
# os_impl::unix) ever calls into sysctl; the one reference is a dead
# `#[cfg(unix)] Error::Sysctl` variant. This vendored fork narrows that one
# cfg (and the matching Cargo.toml dependency table) to exclude illumos —
# byte-identical behavior on every other platform. See vendor/mmap-rs/src/error.rs.
mmap-rs = { path = "vendor/mmap-rs" }
# illumos portability fix: libc's solarish (illumos/solaris) bindings are
# missing CLOCK_PROCESS_CPUTIME_ID / CLOCK_THREAD_CPUTIME_ID even though
# illumos's own <sys/time_impl.h> defines them and clock_gettime(3c)
# accepts them at runtime (verified on OpenIndiana 2026.04) — cpu-time (a
# transitive dep of hnsw_rs, which is always-on) fails to compile without
# them. Rather than vendoring all of libc for two constants, this vendored
# cpu-time (upstream 1.0.0 + one cfg'd import) defines them locally under
# cfg(solarish); every other platform compiles the pristine import path.
# Drop once the upstream rust-lang/libc PR adding the constants is merged
# and released.
cpu-time = { path = "vendor/cpu-time" }
# Phase 51 P6.1b / ADR 107 (docs/ai/decisions/107-training-memory-turboquant-vs-recompute-attention.md):
# grug-train needs to implement a custom recompute-backward attention op
# (FlashAttention-style: keep O(L*d) per layer instead of retaining the full
# O(L^2) attention-score tensor for `.backward()`) using burn-autodiff's own
# `ops::Backward<B, N>` extension mechanism -- the same mechanism `Matmul`/
# `Add`/etc. use internally in `ops/tensor.rs`. Upstream 0.21.0 declares the
# `graph` and `tensor` modules `pub(crate)`, so `AutodiffTensor<B>` (and the
# graph types the public `ops::Backward`/`ops::OpsPrep` API already takes and
# returns) are unreachable from any crate outside burn-autodiff, even though
# every field/method on them is individually `pub` -- there is no other
# public path to a tensor's tracked-graph node. This vendored copy widens
# exactly those two module declarations from `pub(crate)` to `pub`; it adds,
# removes, and changes nothing else, so every existing burn-autodiff caller
# (including the rest of this crate's own dependency graph, since only
# grug-train depends on `burn`) is byte-identical. See
# vendor/burn-autodiff/src/lib.rs for the annotated diff.
burn-autodiff = { path = "vendor/burn-autodiff" }
