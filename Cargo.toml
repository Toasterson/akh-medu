[workspace]
members = [".", "crates/seshat", "crates/heka", "crates/anima-ai", "crates/akhomed-store"]
resolver = "3"

[package]
name = "akh-medu"
version = "0.7.0"
edition = "2024"
description = "Neuro-symbolic AI engine: VSA + knowledge graphs + symbolic reasoning"
license = "GPL-3.0-only"
repository = "https://github.com/Toasterson/akh-medu"
homepage = "https://akh-medu.dev"
readme = "README.md"
keywords = ["ai", "knowledge-graph", "vsa", "reasoning", "neuro-symbolic"]
categories = ["science", "algorithms", "command-line-utilities"]

[dependencies]
# Error handling
miette = { version = "7", features = ["fancy"] }
thiserror = "2"

# Note: We implement our own VSA operations with SIMD kernels
# rather than depending on `hypervector` and `bitvector_simd` which
# have compatibility issues with stable Rust toolchains.

# Symbolic reasoning
egg = "0.11"

# Storage
memmap2 = "0.9"
redb = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
toml = "0.8"

# Concurrency
dashmap = "6"
rayon = "1"

# Search & Graphs
hnsw_rs = "0.3"
anndists = "0.1"
petgraph = "0.7"
oxigraph = { version = "0.5", default-features = false }

# Code analysis
syn = { version = "2", features = ["full", "visit"] }
quote = "1"

# Document parsing
scraper = "0.23"
pdf-extract = "0.10"
epub = "2"

# HTTP (sync)
ureq = { version = "2", features = ["json"] }

# Process management (Unix PID checks)
libc = "0.2"

# Unicode
unicode-normalization = "0.1"

# Numeric
rand = "0.8"

# TUI
ratatui = "0.29"
crossterm = "0.28"
signal-hook = "0.3"

# Infrastructure
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }

# Async runtime (feature-gated; shared by the daemon and the ACP server)
tokio = { version = "1", features = ["full"], optional = true }

# Stream combinators for the oxifed federation channel (feature-gated)
futures-util = { version = "0.3", optional = true }

# WASM tool runtime (feature-gated)
wasmtime = { version = "29", features = ["component-model"], optional = true }

# Federation via oxifed (feature-gated)
lapin = { version = "2", optional = true }
deadpool-lapin = { version = "0.12", optional = true }

# Email channel (feature-gated)
mail-parser = { version = "0.11", optional = true }
imap = { version = "2", optional = true }
native-tls = { version = "0.2", optional = true }
lettre = { version = "0.11", optional = true, default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
regex = "1"

# ELIZA hot-reload (feature-gated)
notify = { version = "6", optional = true }
knuffel = { version = "3", optional = true }

# Archive extraction (for ONNX Runtime setup)
flate2 = "1"
tar = "0.4"

# NLU Tier 2: Micro-ML NER (feature-gated)
ort = { version = "=2.0.0-rc.11", optional = true, default-features = false, features = ["std", "load-dynamic"] }
tokenizers = { version = "0.22", optional = true, default-features = false, features = ["progressbar", "fancy-regex"] }

# NLU Tier 3: Small LLM translator (feature-gated)
llama-cpp-2 = { version = "0.1", optional = true, features = ["sampler"] }
encoding_rs = { version = "0.8", optional = true }

# NLU Candle backend: GGUF inference with hidden state access (feature-gated)
candle-core = { version = "0.10", optional = true }
candle-nn = { version = "0.10", optional = true }
candle-transformers = { version = "0.10", optional = true }
safetensors = { version = "0.7", optional = true }

# Candle audio-native boundary (Gemma 4, ADR 069): 16 kHz mono WAV decode.
hound = "3"
# AMD GPU backend (ROCm/HIP, ADR 068): dlopen the HIP dequant kernel + rocBLAS.
# Optional — only pulled under the `rocm` feature; off by default so CPU-only
# and non-AMD hosts build clean.
libloading = { version = "0.8", optional = true }

# Training: Burn framework for LoRA fine-tuning (future, feature-gated)
# NOTE: Burn 0.21-pre.3's burn-dataset pulls rusqlite→libsqlite3-sys 0.35
# which conflicts with seshat's sea-orm→sqlx→libsqlite3-sys 0.26.
# Deferred until Burn reaches stable release with decoupled dataset crate.
# burn = { version = "0.21", optional = true, default-features = false, features = ["train", "ndarray", "std"] }

# Phase 38: Postgres-backed durable store for relocatable Akhs (feature-gated).
# Pulled in only under the `postgres` feature (folded into `server`), so the
# lean `akh` client binary never compiles SeaORM/sqlx.
akhomed-store = { path = "crates/akhomed-store", optional = true }

# Calendar (feature-gated)
icalendar = { version = "0.16", optional = true, features = ["parser"] }
chrono = { version = "0.4", optional = true, features = ["serde"] }

# Akhipedia wiki (feature-gated)
comrak = { version = "0.31", optional = true, default-features = false, features = ["syntect"] }
syntect = { version = "5", optional = true }
minijinja = { version = "2", optional = true }
tantivy = { version = "0.22", optional = true }
blake3 = { version = "1", optional = true }
agent-client-protocol = { version = "0.14.0", optional = true }

# ACP spike (P0): Unix-socket transport for the Agent Client Protocol.
# `agent-client-protocol` is `futures`-based; we bridge tokio's UnixStream
# halves into `futures::io::{AsyncRead,AsyncWrite}` via `tokio_util::compat`.
tokio-util = { version = "0.7", features = ["compat"], optional = true }
futures = { version = "0.3", optional = true }

[features]
default = ["nlu-candle", "acp"]
daemon = ["tokio"]
# `server` = the akhomed daemon feature set: workspace daemons + the ACP
# inbound transport. (Pre-ADR-061 it pulled axum/tower-http for REST/WS;
# those surfaces are gone, so it now just means daemon + acp.) Phase 38 folds
# in the Postgres backing store.
server = ["daemon", "acp", "postgres"]
# Phase 38a/38b: Postgres backing store. Optional at runtime (no [postgres]
# config = legacy local-only mode); this feature only controls whether the code
# is built. Pulls in `tokio` because the WAL flusher (38b) is async.
postgres = ["dep:akhomed-store", "tokio"]
oxifed = ["daemon", "lapin", "deadpool-lapin", "futures-util"]
email = ["mail-parser", "imap", "native-tls", "lettre"]
calendar = ["icalendar", "chrono"]
wasm-tools = ["wasmtime"]
nlu-ml = ["ort", "tokenizers"]
nlu-llm = ["llama-cpp-2", "encoding_rs"]
nlu-full = ["nlu-ml", "nlu-llm"]
delegation = ["daemon"]
candle-backend = ["candle-core", "candle-nn", "candle-transformers", "safetensors", "tokenizers"]
nlu-candle = ["candle-backend"]
# AMD GPU acceleration for the Candle backend (ADR 068). Opt-in: requires the
# ROCm toolchain to build the HIP kernel (build.rs degrades gracefully if absent)
# and an AMD GPU at runtime. Off by default — Candle runs CPU-only without it.
rocm = ["candle-backend", "dep:libloading"]
# Apple Metal GPU acceleration for the Candle backend (Apple Silicon — e.g. the
# Mac mini). Enables candle's Metal device; the backend selects it at runtime via
# the `#[cfg(feature = "metal")]` path in candle_backend.rs. macOS/arm64 only —
# do not enable on Linux (candle's Metal backend won't compile there).
metal = ["candle-backend", "candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
burn-training = ["candle-backend"]  # will add "burn" when sqlite3 conflict resolved
training-data = []
wiki = ["dep:comrak", "dep:syntect", "dep:minijinja", "dep:tantivy", "dep:blake3"]
sparql-persist = ["oxigraph/rocksdb"]
# Phase 32: LLM knowledge elicitation via T5 Knowledge model (Phase 35 provides
# the model weights; this gate enables the elicitation code path).
# Requires candle-backend. Gracefully degrades to web-API-only without the
# t5-knowledge-q6k.gguf model file.
knowledge-bootstrap = ["candle-backend"]
eliza = ["daemon", "dep:notify", "dep:knuffel"]
agent-client-protocol = ["dep:agent-client-protocol"]
# Phase P0 spike: ACP agent over a Unix domain socket, wrapping ChatProcessor
# for one in-process workspace. Additive and OFF by default — does not touch
# REST/WS/MCP transports. See src/acp/mod.rs and ADR-027 (concurrency invariant).
acp = ["dep:agent-client-protocol", "dep:tokio-util", "dep:futures", "tokio"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bin]]
name = "akh"
path = "src/main.rs"

[[bin]]
name = "akhomed"
path = "src/bin/akhomed.rs"
required-features = ["server"]

[[bin]]
name = "generate_qa_dataset"
path = "src/bin/generate_qa_dataset.rs"

[[bench]]
name = "vsa_ops"
harness = false

[[bench]]
name = "phase26"
harness = false

[[bench]]
name = "phase41g"
harness = false

[[bench]]
name = "vsa_rl_cycles"
harness = false

[[bench]]
name = "vsa_decide"
harness = false
