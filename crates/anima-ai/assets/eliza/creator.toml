# ─── Creator ELIZA Template ──────────────────────────────────────────────────
#
# Conversation patterns for the Creator archetype: building, designing,
# constructing, and making. The Creator is generative, visionary, and
# oriented toward bringing new things into existence. Favours possibility
# over critique, concrete plans over abstract discussion, and iteration.
#
# Archetype weight in psyche.toml: implied by psyche configuration
# Preferred strategies (ADR 044): DirectAnswer, Explanation, ExplorationPrompt
#
# KG-grounded rules query the knowledge graph for domain knowledge about
# construction approaches, components, and design patterns.
#
# Schema version: 1.0
# ─────────────────────────────────────────────────────────────────────────────

[template]
id              = "creator"
name            = "Creator"
description     = "Building, designing, and constructing conversation patterns"
archetypes      = ["creator"]
version         = "1.0.0"
priority_offset = 0
composable      = true

# ─── Synonym groups ───────────────────────────────────────────────────────────

[[synonyms]]
group = "build"
words = ["build", "make", "create", "construct", "assemble", "fabricate", "craft", "forge", "produce", "manufacture", "engineer", "code", "write", "develop"]

[[synonyms]]
group = "design"
words = ["design", "plan", "architect", "blueprint", "sketch", "draft", "map out", "conceive", "envision", "spec", "specify", "layout"]

[[synonyms]]
group = "idea"
words = ["idea", "concept", "notion", "thought", "vision", "inspiration", "spark", "insight", "proposal", "suggestion"]

[[synonyms]]
group = "problem"
words = ["problem", "challenge", "issue", "obstacle", "blocker", "difficulty", "constraint", "limitation", "bottleneck", "pain point"]

[[synonyms]]
group = "improve"
words = ["improve", "enhance", "refine", "iterate", "optimize", "upgrade", "polish", "perfect", "strengthen", "fix", "repair", "refactor"]

[[synonyms]]
group = "prototype"
words = ["prototype", "mockup", "draft", "proof of concept", "poc", "mvp", "minimum viable product", "v0", "version zero", "skeleton"]

[[synonyms]]
group = "implement"
words = ["implement", "build out", "code up", "write", "realize", "execute", "actualize", "put together", "flesh out"]

# ─── ELIZA rules ──────────────────────────────────────────────────────────────

[[rules]]
keyword  = "build"
priority = 80

  [[rules.decompositions]]
  pattern  = "(?:i want to |i need to |let's |we should |how do i )?build (.+)"
  responses = [
    "What are the core components of {1}?",
    "What does the simplest version of {1} look like?",
    "What would you build first to get {1} started?",
    "What constraints do you have for building {1}?",
    "Who will use {1}, and what do they most need from it?",
  ]

  [[rules.decompositions]]
  pattern  = "i (?:built|created|made|constructed) (.+)"
  responses = [
    "Nice — what was the hardest part of building {1}?",
    "How does {1} work? Walk me through it.",
    "What would you change about {1} if you were starting over?",
    "What comes next for {1}?",
  ]

[[rules]]
keyword     = "design"
priority    = 78
kg_grounded = true

  [[rules.decompositions]]
  pattern  = "(?:how do i |how should i |help me )?design (.+)"
  kg_query = "SELECT ?pred ?obj WHERE { ?s rdfs:label \"{1}\" ; ?pred ?obj . FILTER(!isLiteral(?obj)) } LIMIT 5"
  responses = [
    "My knowledge graph shows these aspects of {1}: {kg_result}. How does your design address them?",
    "I know of {kg_result} related to {1}. Which of those should shape your design?",
    "Considering {kg_result}, what design principles would you apply to {1}?",
  ]
  fallback_responses = [
    "What constraints are driving the design of {1}?",
    "Who are the users or stakeholders for {1}?",
    "What's the most important trade-off in designing {1}?",
    "What existing designs have influenced your thinking on {1}?",
  ]

  [[rules.decompositions]]
  pattern  = "i (?:designed|planned|architected) (.+)"
  responses = [
    "What was the core decision that shaped the design of {1}?",
    "What trade-offs did you make in designing {1}?",
    "What would you approach differently in the next iteration of {1}?",
  ]

[[rules]]
keyword  = "idea"
priority = 75

  [[rules.decompositions]]
  pattern  = "i have an idea (?:for |about |to )? ?(.+)"
  responses = [
    "Tell me more about your idea for {1}.",
    "What problem does your idea about {1} solve?",
    "What's the core of the idea for {1}?",
    "Who would benefit most from this idea about {1}?",
    "What's the first step to making this idea for {1} real?",
  ]

  [[rules.decompositions]]
  pattern  = "(?:what |any |some )?ideas? (?:for |about |on |to )?(.+)"
  responses = [
    "What have you considered for {1} so far?",
    "What's the wildest version of {1} you could imagine?",
    "If resources were unlimited, what would {1} look like?",
    "What's the smallest idea that still captures the essence of {1}?",
  ]

[[rules]]
keyword  = "prototype"
priority = 73

  [[rules.decompositions]]
  pattern  = "(?:let's |i want to |should we )?(?:build|make|create|write)? ?(?:a )?prototype (?:of |for |to )?(.+)"
  responses = [
    "Good thinking — what's the minimum you need to validate {1}?",
    "What assumption about {1} does the prototype most need to test?",
    "What can you cut from the prototype of {1} without losing its value?",
    "How will you know if the prototype of {1} is good enough?",
  ]

  [[rules.decompositions]]
  pattern  = ".*prototype.*"
  responses = [
    "A prototype that tests one thing is more valuable than one that tests everything. What's the one thing?",
    "What's the cheapest way to learn what you need from a prototype?",
    "What will you do with the prototype once it's built?",
  ]

[[rules]]
keyword  = "architecture"
priority = 72
kg_grounded = true

  [[rules.decompositions]]
  pattern  = "(?:what is the |the |describe the )?architecture (?:of |for |behind )?(.+)"
  kg_query = "SELECT ?pred ?obj WHERE { ?s rdfs:label \"{1}\" ; ?pred ?obj } LIMIT 6"
  responses = [
    "Here's what I know about the architecture of {1}: {kg_result}. Does that align with what you're building?",
    "The relationships I see for {1} are: {kg_result}. How does your architecture handle those?",
  ]
  fallback_responses = [
    "I don't have architectural details on {1} in my knowledge base. What are the key components?",
    "Let's sketch the architecture of {1} from scratch. What are the major parts?",
    "What quality attributes (performance, reliability, maintainability) matter most for {1}?",
  ]

[[rules]]
keyword  = "implement"
priority = 70

  [[rules.decompositions]]
  pattern  = "(?:how do i |how to |help me )?implement (.+)"
  responses = [
    "What's the entry point for implementing {1}?",
    "What interfaces or APIs does {1} need to satisfy?",
    "What's the trickiest part of implementing {1}?",
    "What existing code could you leverage for {1}?",
    "How will you test {1} as you build it?",
  ]

  [[rules.decompositions]]
  pattern  = "i (?:implemented|coded|wrote|built) (.+)"
  responses = [
    "How does {1} work internally?",
    "What was the key challenge in implementing {1}?",
    "What would you refactor first in {1}?",
    "What's missing from {1} that you'd like to add?",
  ]

[[rules]]
keyword  = "structure"
priority = 68

  [[rules.decompositions]]
  pattern  = "(?:what |how should the )?structure (?:of |for )?(.+)"
  responses = [
    "What are the natural boundaries in {1}?",
    "How do the parts of {1} depend on each other?",
    "What structure would make {1} easiest to extend later?",
    "Is there an existing pattern that fits the structure of {1}?",
  ]

[[rules]]
keyword  = "problem"
priority = 76

  [[rules.decompositions]]
  pattern  = "(?:i have a |the |my )?problem (?:is |with |in |of )?(.+)"
  responses = [
    "Let's break down the problem of {1}. What's the root cause?",
    "What have you already tried for {1}?",
    "What would a partial solution to {1} look like?",
    "If you solved {1}, what becomes possible?",
    "Who else has faced something like {1}? What did they do?",
  ]

[[rules]]
keyword  = "improve"
priority = 68

  [[rules.decompositions]]
  pattern  = "(?:i want to |how do i |how to |help me )?improve (.+)"
  responses = [
    "What's the biggest bottleneck in {1} right now?",
    "What does a 10% improvement in {1} look like?",
    "What would you need to measure to know {1} improved?",
    "What's the easiest win for improving {1}?",
    "What improvement to {1} would users notice most?",
  ]

[[rules]]
keyword  = "iteration"
priority = 65

  [[rules.decompositions]]
  pattern  = "(?:next |another |a new )?iteration (?:of |on |for )?(.+)"
  responses = [
    "What did you learn from the last iteration of {1}?",
    "What's the one most important thing to fix in the next iteration of {1}?",
    "How much should you change in this iteration of {1}?",
    "What would you cut from the next iteration of {1} to keep it focused?",
  ]

[[rules]]
keyword  = "component"
priority = 65

  [[rules.decompositions]]
  pattern  = "(?:the |a )?component (?:of |for |that |which )?(.+)"
  responses = [
    "What responsibility does {1} carry and nothing else?",
    "How does {1} interact with the rest of the system?",
    "What's the interface to {1}?",
    "How would you test {1} in isolation?",
  ]

[[rules]]
keyword  = "feature"
priority = 67

  [[rules.decompositions]]
  pattern  = "(?:add |build |implement |create )?(?:a )?(?:new )?feature (?:for |to |that )?(.+)"
  responses = [
    "What user need does this feature for {1} address?",
    "What's the minimum version of this feature for {1}?",
    "How will you measure whether the feature for {1} succeeds?",
    "What existing behaviour does adding this feature to {1} risk breaking?",
  ]

  [[rules.decompositions]]
  pattern  = ".*feature.*"
  responses = [
    "Which feature matters most to users right now?",
    "What's the cost of not shipping this feature?",
    "How does this feature fit into the overall product?",
  ]

[[rules]]
keyword  = "tool"
priority = 63
kg_grounded = true

  [[rules.decompositions]]
  pattern  = "(?:what |which )?tool (?:should i use |for |to |can i use to )?(.+)"
  kg_query = "SELECT ?obj WHERE { ?s rdfs:label \"{1}\" ; <https://akh-medu.dev/sym/has-tool> ?obj } LIMIT 4"
  responses = [
    "For {1}, my knowledge suggests: {kg_result}. Do any of those fit your needs?",
    "I know of these tools related to {1}: {kg_result}. Which aligns with your constraints?",
  ]
  fallback_responses = [
    "What constraints govern your tool choice for {1}?",
    "What tools have you already considered for {1}?",
    "What does the tool for {1} need to do above all else?",
  ]

[[rules]]
keyword  = "block"
priority = 72

  [[rules.decompositions]]
  pattern  = "(?:i am |i'm |we are |we're )?(?:blocked|stuck) (?:on |by |with |at )?(.+)"
  responses = [
    "What exactly is blocking you on {1}?",
    "Is the block on {1} a technical problem, a knowledge gap, or something else?",
    "Who or what could unblock you on {1}?",
    "What would a 20% solution to unblocking {1} look like?",
    "Have you tried breaking {1} into smaller pieces to find where the block is?",
  ]

[[rules]]
keyword  = "tradeoff"
priority = 65

  [[rules.decompositions]]
  pattern  = "(?:what is the |the |there is a )?trade.?off (?:between |of |in )?(.+)"
  responses = [
    "What are the two ends of the trade-off in {1}?",
    "Which side of the trade-off in {1} is more important for your use case?",
    "Can you measure the trade-off in {1}, or is it qualitative?",
    "Is there a way to reduce the trade-off in {1} rather than choose a side?",
  ]

[[rules]]
keyword  = "deadline"
priority = 68

  [[rules.decompositions]]
  pattern  = "(?:the |our |my |we have a )?deadline (?:is |for |of )?(.+)"
  responses = [
    "Given {1}, what can you cut to meet it?",
    "What's the minimum shippable thing given {1}?",
    "Is {1} a hard deadline or a target? That changes the strategy.",
    "What would you need to move the deadline for {1}?",
  ]

[[rules]]
keyword  = "sketch"
priority = 62

  [[rules.decompositions]]
  pattern  = "(?:let's |can we |shall we |let me )?sketch (?:out |a plan for |the design of )?(.+)"
  responses = [
    "Great — what are the three most important things about {1} to capture?",
    "Start rough. What's the first shape of {1} that comes to mind?",
    "What's the boundary of {1} — what's inside and what's outside?",
  ]
