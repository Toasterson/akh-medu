[package]
name = "akh-service-store"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Transactional durable records for independently owned Akh services"
[dependencies]
akh-session-types = { path = "../akh-session-types" }
# Bounds the Postgres read cache. Already resolved in the workspace lock as
# a transitive dependency, so this adds no new crate to the tree.
lru = "0.12"
redb = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Postgres backend. Version/feature set kept in step with the sqlx already
# resolved in the workspace lock via `sea-orm` (crates/akhomed-store,
# crates/seshat, crates/heka all pull sqlx 0.8 + `runtime-tokio-rustls`), so
# this adds no second sqlx/rustls stack to the dependency tree.
sqlx = { version = "0.8", default-features = false, features = [
    "postgres",
    "runtime-tokio-rustls",
] }
# `sync` for the Notify behind Store::changes().
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
tracing = "0.1"
[dev-dependencies]
tempfile = "3"
# `macros` for `#[tokio::test(flavor = "multi_thread", ...)]`, used to
# reproduce the "sync facade called from an async multi-thread runtime
# worker" incident shape in tests.
# `time` for the timeouts that prove `changes()` fires on commit and stays
# quiet on rollback.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
