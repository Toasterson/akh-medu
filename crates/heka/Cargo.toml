[package]
name = "heka"
version = "0.1.0"
edition = "2024"
description = "Heka — Postgres+pgvector evaluation store for akh-medu long-term memory"
license = "GPL-3.0-only"
repository = "https://github.com/Toasterson/akh-medu"

[dependencies]
# Database (SeaORM + PostgreSQL) — mirrors crates/seshat
sea-orm = { version = "1", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-uuid",
    "with-chrono",
    "with-json",
] }
sea-orm-migration = { version = "1", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
sea-query = "0.32"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Types
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling
miette = { version = "7", features = ["fancy"] }
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI (Phase 42b — eval harness)
clap = { version = "4.5", features = ["derive"] }

# Hardware/system metadata for eval reports (Phase 42b)
sysinfo = "0.33"

[features]
default = []

[[bin]]
name = "hekad"
path = "src/bin/hekad.rs"
