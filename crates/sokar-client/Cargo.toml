[package]
name = "sokar-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-only"
description = "Sokar artifact wire types and HTTP client"

[features]
default = ["client"]
types-only = []
client = ["dep:reqwest", "dep:url"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde", "serde-well-known"] }
hex = "0.4"
mime = "0.3"
unicode-normalization = "0.1"
miette = "7"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"], optional = true }
url = { version = "2", optional = true }
