[package]
name = "akh-session-services"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Independent Akh session, runtime, sandbox, executor and ingress services"

[dependencies]
akh-session-types = { path = "../akh-session-types" }
akh-runtime = { path = "../akh-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
akh-service-store = { path = "../akh-service-store" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls", "stream"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
sha2 = "0.10"
base64 = "0.22"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
globset = "0.4"
url = "2"
jsonschema = { version = "0.33", default-features = false }
async-stream = "0.3"
lapin = "2"
tokio-executor-trait = "2"
tokio-reactor-trait = "1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
