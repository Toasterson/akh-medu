[package]
name = "akh-egraph-bench"
version = "0.1.0"
edition = "2024"
description = "Phase 40 wake-path measurement harness: e-graph re-saturation + HNSW(VSA) rebuild"
license = "GPL-3.0-only"
publish = false

[dependencies]
# The engine under measurement. Default features pull the candle backend,
# which the bench does not need; reason/vsa/simd are unconditional modules.
akh-medu = { path = "../..", default-features = false }

egg = "0.11"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
