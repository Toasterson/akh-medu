[package]
name = "sokar"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-only"
description = "Sokar content-addressed artifact daemon"

[[bin]]
name = "sokard"
path = "src/main.rs"

[dependencies]
sokar-client = { path = "../sokar-client", default-features = false, features = ["types-only"] }
opendal = { version = "0.59", features = ["services-s3", "services-fs", "services-memory", "services-gcs", "services-azblob", "layers-prometheus-client", "layers-tracing"] }
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["trace", "cors", "request-id", "limit", "set-header"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "uuid", "time", "json", "migrate", "macros"] }
uuid = { version = "1", features = ["v7", "serde"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mime = "0.3"
bytes = "1"
futures = "0.3"
http-body-util = "0.1"
prometheus-client = "0.25"
time = { version = "0.3", features = ["serde", "serde-well-known"] }
url = "2"
async-trait = "0.1"
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
sokar-client = { path = "../sokar-client", features = ["client"] }
