[package]
name = "seshat"
version = "0.1.0"
edition = "2024"
description = "Seshat's Archive — shared corpus library with RAG + pgvector for akh-medu"
license = "GPL-3.0-only"
repository = "https://github.com/Toasterson/akh-medu"

[dependencies]
# Database (SeaORM + PostgreSQL)
sea-orm = { version = "1", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-uuid",
    "with-chrono",
    "with-json",
] }
sea-orm-migration = { version = "1", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
sea-query = "0.32"

# MCP server
rmcp = { version = "0.17", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
] }

# Async runtime + web server
tokio = { version = "1", features = ["full"] }
axum = "0.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Types
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling
miette = { version = "7", features = ["fancy"] }
thiserror = "2"

# Schema generation for MCP tool parameters
schemars = { version = "0.8", features = ["uuid1", "chrono"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Phase 38i: OTLP tracing skeleton. Exact-pinned per research §2.1.
# Default-on under the `tracing-otel` feature (folded into `default` so seshd
# always ships with OTLP); the feature is also independently togglable.
opentelemetry = { version = "=0.27", optional = true }
opentelemetry_sdk = { version = "=0.27", features = ["rt-tokio", "metrics"], optional = true }
opentelemetry-otlp = { version = "=0.27", features = ["grpc-tonic", "trace", "metrics"], optional = true }
tracing-opentelemetry = { version = "=0.28", optional = true }
opentelemetry-semantic-conventions = { version = "=0.27", features = ["semconv_experimental"], optional = true }

# Hashing (for query cache keys)
sha2 = "0.10"

# Embedding (shared ONNX sentence embedder, extracted from this crate —
# see docs/wayfinder/transcript-harvest/tickets/embedding-pipeline.md §3) —
# feature-gated
akh-embed = { path = "../akh-embed", optional = true }

# LLM synthesis via Candle (aligned with Phase 26b) — feature-gated
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }

# HTTP client for model downloads
ureq = { version = "2", features = ["json"] }

# Archive extraction for model downloads
flate2 = "1"
tar = "0.4"

[dev-dependencies]
# Phase 51 P3d-2: the semantic-retrieval corpus + retrievers, to measure
# learned-embedding recall vs the surface floor (examples/semantic_recall_minilm).
grug-data = { path = "../grug-data" }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
sea-orm = { version = "1", features = ["mock"] }

[features]
default = ["embedding", "tracing-otel"]
embedding = ["dep:akh-embed"]
synthesis = ["candle-core", "candle-nn", "candle-transformers"]
# Phase 38i: OTLP tracing for seshd. Default-on (research §8: accept-parent
# sampling on seshd). Off-by-default build excludes all OTel crates from link.
tracing-otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry", "dep:opentelemetry-semantic-conventions"]

[[bin]]
name = "seshd"
path = "src/main.rs"
