# Phase 41g benchmark dataset — prompt → plan → execute
# Categories: code-add, code-edit, refactor, doc-write, debug
# Each prompt carries acceptance predicates evaluated against pipeline output.

# ---------------------------------------------------------------------------
# code-add: add new constructs to a Rust codebase
# ---------------------------------------------------------------------------

[[prompts]]
id = "code_add_001"
category = "code-add"
prompt = "Add a Rust struct Foo with a name: String field, derive Debug and Clone, with proper error handling using miette and unit tests."

[[prompts.acceptance]]
kind = "output_contains"
pattern = "struct Foo"

[[prompts.acceptance]]
kind = "output_contains"
pattern = "#[derive"

[[prompts.acceptance]]
kind = "plan_has_min_steps"
min_steps = 2

# ---

[[prompts]]
id = "code_add_002"
category = "code-add"
prompt = "Add a new enum Color with variants Red, Green, Blue to the codebase. Include Display impl and a unit test."

[[prompts.acceptance]]
kind = "output_contains"
pattern = "enum Color"

[[prompts.acceptance]]
kind = "output_contains"
pattern = "impl"

# ---

