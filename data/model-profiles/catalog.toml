# Model catalog: per-model defaults for an akh's budgets, limits and timeouts (ADR 123).
#
# One source of truth for two readers:
# - akhomed compiles this file in (`src/agent/model_profile.rs`, `ModelCatalog::builtin`) and
#   resolves each akh's profile at load: per-akh `[model_profile]` override > this catalog's
#   row for (model, reasoning_effort) > the global default (env var, else the compiled constant).
# - the Roman renderer (`deploy/roman-mini/full_akh.py`) reads it to document the profile it
#   renders, so the rendered TOML and the running core agree.
#
# Every number here is an ESTIMATE derived in ADR 123 from the sources cited there (vendor docs,
# Artificial Analysis throughput, ollama.com/pricing on 2026-09-30). Change a value by editing
# this file, citing the reason in ADR 123's table, and re-rendering the Romans.
#
# Row matching (case-insensitive, a trailing `:cloud` tag ignored): an exact `ids` hit wins,
# otherwise the longest `prefixes` hit. No hit: the global defaults apply unchanged.
#
# Fields (all optional; an absent field falls through to the next tier):
#   max_tokens_per_day   prompt + completion tokens per UTC day for background work (the
#                        `[autonomy.budget]` governor; subscription credit, not a hard API limit)
#   max_turns_per_day    background model turns per UTC day
#   max_tokens_per_wake  prompt + completion tokens one agentic turn may spend before it is
#                        stopped and forced to answer with what it has
#   turn_deadline_secs   wall clock of one agentic turn (checked between model rounds)
#   max_rounds           model rounds (tool-call iterations) per agentic turn
#   http_timeout_secs    one LLM HTTP request: Ollama = read/idle gap between stream chunks,
#                        OpenAI-compatible = total request time
#   max_output_tokens    generated tokens per request, reasoning included (Ollama `num_predict`,
#                        OpenAI `max_tokens`)
#   context_window       working context window; never above what the model reports
#   max_tools_per_wake   relevance-scoped tool count offered to a reactor wake; tools the wake's
#                        route or prompt names are always kept on top of it
#   max_tools_per_turn   tools offered to an interactive (ACP / T3 / chat) turn, the akh's
#                        `pinned_tools` core included (always offered, first, name-sorted), the
#                        rest relevance-scoped picks; absent = the whole catalog. Set it for
#                        slow-prefill local servers only: the tool schemas dominate the prompt
#                        and a prefix cache only helps while the offered set is unchanged
#                        (ADR 123 amendment 2026-09-30)
#   repeat_penalty       sampling `repeat_penalty` (1.0..=2.0) sent on OpenAI-compatible requests
#                        only when set; local llama.cpp rows only, because cloud APIs may reject
#                        unknown parameters (ADR 123 amendment 2026-10-01)
#
# `[models.effort.<low|medium|high|max>]` overrides the row for that `reasoning_effort`; the
# row itself describes the model at its default effort (what an akh without `reasoning_effort`
# gets).

schema_version = 1

# ── Zhipu GLM on Ollama Cloud ────────────────────────────────────────────────
# GLM-5.3: 1M context, 128K max output, default effort `max` (thinking always on), about 71 tok/s
# and a 32 s time to first answer token at max effort (Artificial Analysis). $1.40 / $0.26 cached
# / $4.40 per M tokens on Ollama Cloud.
[[models]]
id = "glm-5.3"
ids = ["glm-5.3"]
prefixes = ["glm-5"]
serving = "ollama-cloud"
[models.profile]
max_tokens_per_day = 1_500_000
max_turns_per_day = 96
max_tokens_per_wake = 250_000
turn_deadline_secs = 1_800
max_rounds = 30
http_timeout_secs = 300
max_output_tokens = 32_768
context_window = 262_144
max_tools_per_wake = 24
[models.effort.high]
turn_deadline_secs = 1_500
max_rounds = 28
http_timeout_secs = 240
max_output_tokens = 24_576
[models.effort.medium]
turn_deadline_secs = 1_500
max_rounds = 28
http_timeout_secs = 240
max_output_tokens = 24_576
[models.effort.low]
max_tokens_per_wake = 150_000
turn_deadline_secs = 600
max_rounds = 16
http_timeout_secs = 180
max_output_tokens = 8_192

