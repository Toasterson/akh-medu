# ── Local models ─────────────────────────────────────────────────────────────
# Gemma 4 12B, Lilith's parent (ADR 116, ADR 121): llama.cpp llama-server (HIP, Q8_0, 12.7 GB)
# on hephaistos' 24 GB RX 7900 XTX, two 65,536-token slots. Decode is memory-bound: at most about
# 75 tok/s on 960 GB/s, about 50 tok/s measured on a comparable 24 GB card. Tokens cost no credit,
# so the daily cap only bounds GPU time. Small models degrade past about 14 offered tools (ADR 089).
# repeat_penalty = 1.1 (measured 2026-10-01, ADR 123 amendment): after a tool result the model
# sometimes loops on empty thought blocks `<|channel>thought\n<channel|>` until max_tokens
# (5 of 10 runs at default sampling, finish=length, no content/reasoning/tool deltas); at 1.05,
# 1.1 and 1.15 the loop appeared in 0 of 10 runs and UUID copying stayed intact (DRY 0.8: 1 of
# 10). max_output_tokens = 4_096 (was 8_192): a loop emits nothing, so its cost is wall clock,
# about 236 s at 8,192 tokens versus about 118 s at 4,096; the loop guard retries once, so the
# worst case stays at the old single-loop cost. A legitimate Lilith reply or tool call is a few
# hundred tokens.
[[models]]
id = "gemma-4-12b"
ids = ["gemma4:12b", "gemma-4-12b", "lilith"]
prefixes = ["gemma4", "gemma-4"]
serving = "local"
[models.profile]
max_tokens_per_day = 3_000_000
max_turns_per_day = 96
max_tokens_per_wake = 150_000
turn_deadline_secs = 1_200
max_rounds = 20
http_timeout_secs = 600
max_output_tokens = 4_096
context_window = 49_152
max_tools_per_wake = 16
max_tools_per_turn = 16
repeat_penalty = 1.1

