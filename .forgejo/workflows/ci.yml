name: CI
on: [push, pull_request]

jobs:
  # Scoped to the seshat crate — the full akh-medu workspace release build
  # OOM-kills rustc on the Solstice runner. Broader test/clippy/release-build
  # coverage can return once the codebase is lighter or the runner is bigger.
  check-seshat:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config protobuf-compiler libprotobuf-dev libssl-dev

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo '. "$HOME/.cargo/env"' >> ~/.profile

      - name: cargo check -p seshat
        run: |
          . "$HOME/.cargo/env"
          # Default features only (includes `embedding`; excludes the memory-
          # heavy `synthesis` candle feature which OOMs the runner).
          CARGO_BUILD_JOBS=2 cargo check -p seshat

  docker-seshd:
    runs-on: ubuntu-22.04
    # Intentionally independent of check-seshat so that one doesn't block the
    # other. The docker build itself catches anything check missed.
    steps:
      - name: Log in to Forgejo container registry
        # Anima's CI runs on a Solstice runner that apparently has pre-baked
        # registry auth; ours doesn't (push returns 401 without this). The
        # token here is the same Forgejo PAT that's already embedded in the
        # anima helmrelease in the homelab flux repo — treat it like the
        # existing secret pattern, not a new exposure.
        env:
          REGISTRY_USER: toasterson
          REGISTRY_TOKEN: b3b30ffd2147b53fa836e6ac02c6cbe8f382edd7
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login code.aopc.cloud \
            -u "$REGISTRY_USER" --password-stdin

      - name: Build seshd image
        # Plain `docker build` against the Solstice VM's pre-baked daemon so
        # registry auth from ~/.docker/config.json (pre-populated by the
        # runner image) is used for the subsequent push — matches the pattern
        # the Anima CI uses to push anima-server / anima-ai / anima-agent.
        run: |
          REGISTRY=code.aopc.cloud/toasterson
          SHA=${SOLSTICE_COMMIT_SHA:-${GITHUB_SHA:-local}}
          SHORT_SHA=$(printf '%s' "$SHA" | cut -c1-12)
          docker build -f docker/seshd.Dockerfile \
            -t "$REGISTRY/seshd:$SHORT_SHA" \
            -t "$REGISTRY/seshd:latest" \
            .

      - name: Smoke-test seshd binary (catch stub-binary regression)
        run: |
          REGISTRY=code.aopc.cloud/toasterson
          SHA=${SOLSTICE_COMMIT_SHA:-${GITHUB_SHA:-local}}
          SHORT_SHA=$(printf '%s' "$SHA" | cut -c1-12)
          # Real seshd prints a miette diagnostic for a missing config file.
          # The 0.6.0 stub-binary bug silently exits 0 with no output.
          SMOKE=$(docker run --rm --entrypoint seshd "$REGISTRY/seshd:$SHORT_SHA" /nonexistent 2>&1 || true)
          echo "smoke output: $SMOKE"
          if [ -z "$SMOKE" ]; then
            echo "seshd produced no output for a missing config - likely stub binary" >&2
            exit 1
          fi

      - name: Push seshd image
        run: |
          REGISTRY=code.aopc.cloud/toasterson
          SHA=${SOLSTICE_COMMIT_SHA:-${GITHUB_SHA:-local}}
          SHORT_SHA=$(printf '%s' "$SHA" | cut -c1-12)
          docker push "$REGISTRY/seshd:$SHORT_SHA"
          docker push "$REGISTRY/seshd:latest"
