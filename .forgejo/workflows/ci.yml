name: CI
# Each event is claimed by exactly one lane, so a commit never runs the same
# job twice.
#
# `on: [push, pull_request]` fired BOTH events for every push to a PR branch,
# so each commit started two identical copies of every job. With five jobs
# that is ten concurrent runs per commit, all contending for the same Solstice
# runner pool on archibald (16 cores, also hosting Forgejo, the akh daemons
# and the Anima runners). The duplicates did not fail on their merits — they
# starved. Measured on 96b255d: `check-akh-medu (push)` succeeded in 38m33s
# while `check-akh-medu (pull_request)` — same job, same commit, same code —
# failed after 1h3m42s. Job durations across the branch climbed monotonically
# with contention: 18m → 20m → 32m → 38m → 49m → 1h3m → 1h18m.
#
# Those phantom timeouts are what feeds Anima's CI-red corrective loop, which
# parks a work item after three strikes. Halving the load is therefore a
# correctness fix for the signal, not just a speed optimisation: a lane that
# times out under its own duplicate is not evidence of anything.
#
# Feature branches are covered by the pull_request lane (Anima opens a PR for
# every work item, and the ci_green exit bar binds to the PR head). main and
# develop are covered by the push lane, which is the one that publishes the
# seshd image and the Helm chart.
#
# Forgejo evaluates workflow concurrency before dispatch to Solstice. Let a
# main release finish even when another merge arrives; otherwise long image
# builds never publish. PR updates still cancel superseded checks. The shared
# main group also serializes channel promotion, including manually rerun jobs.
concurrency:
  group: akh-ci-${{ forgejo.ref }}
  cancel-in-progress: ${{ forgejo.ref != 'refs/heads/main' }}
env:
  CARGO_INCREMENTAL: "0"
  SCCACHE_IDLE_TIMEOUT: "0"

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  test-session-platform:
    runs-on: rust
    steps:
      - name: Install Rust and platform test prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y build-essential pkg-config protobuf-compiler libssl-dev libcurl4-openssl-dev libexpat1-dev zlib1g-dev xz-utils python3 git
          sh .forgejo/scripts/run-logged.sh install-git sh scripts/session-platform/install-ci-git.sh
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
      - name: Install Python 3.12 for platform and Roman contracts
        run: |
          sh .forgejo/scripts/install-ci-python.sh
          "$HOME/.local/bin/akh-ci-python" .forgejo/scripts/test_build_platform_images.py
      - name: Verify independent daemon profiles and platform contracts
        run: |
          test ! -f "$HOME/.cargo/env" || . "$HOME/.cargo/env"
          export CARGO_BUILD_JOBS=2 CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0 CARGO_INCREMENTAL=0
          sh .forgejo/scripts/run-logged.sh daemon-profiles "$HOME/.local/bin/akh-ci-python" scripts/session-platform/check-profiles.py
          # Every akh-session-services feature except the GPU backends: `metal`
          # pulls objc2 (Apple-only) and `hip`/`vulkan` need driver SDKs, none
          # of which exist on the Linux runner, so `--all-features` cannot build here.
          sh .forgejo/scripts/run-logged.sh platform-tests cargo test --quiet --locked -p akh-session-services --features session,runtime,candle-runtime,core-integration-tests,executor,sandbox,events,helpers,client,admin,profiling,trigger,kagent -p akh-runtime -p akh-session-types -p akh-service-store
      - name: Verify Roman observer and escalation recovery
        run: |
          "$HOME/.local/bin/akh-ci-python" -m unittest discover -s deploy/roman-mini -p 'test_*.py'

  # Sokar artifact daemon (Phase 52, ADR 108): unit + integration tests on the
  # OpenDAL memory/fs services. Postgres and MinIO contract tests skip or are
  # #[ignore] when SOKAR_TEST_DATABASE_URL / SOKAR_MINIO_* are unset, so this
  # job needs no services.
  test-sokar:
    runs-on: rust
    steps:
      - name: Install dependencies
        run: |
          if ! pkg-config --exists openssl 2>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -qq -y build-essential pkg-config libssl-dev
          fi

      - name: Toolchain, fmt, clippy -D warnings, test (sokar + sokar-client)
        # One step on purpose: the toolchain choice is exported into the same
        # shell. The `rust` runner image ships a system rustup under /opt/rust
        # that the job user cannot modify (toolchain install -> EACCES), so we
        # use it as-is when it is >= 1.91 (opendal 0.59 MSRV) and has clippy +
        # rustfmt, and otherwise install a user-level stable under a writable
        # RUSTUP_HOME.
        run: |
          set -eu
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          test ! -f "$HOME/.cargo/env" || . "$HOME/.cargo/env"
          need=1.91
          have=$(rustc --version 2>/dev/null | awk '{print $2}' || echo 0)
          usable=1
          [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -n1)" = "$need" ] || usable=0
          cargo clippy --version >/dev/null 2>&1 || usable=0
          cargo fmt --version >/dev/null 2>&1 || usable=0
          if [ "$usable" != 1 ]; then
            echo "preinstalled toolchain ($have) unusable for sokar; installing user-level stable"
            export RUSTUP_HOME="$HOME/.rustup" RUSTUP_TOOLCHAIN=stable
            rustup toolchain install stable --profile minimal -c clippy -c rustfmt
          fi
          rustc --version
          cargo clippy --version
          cargo fmt --version
          export CARGO_BUILD_JOBS=2 CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0 CARGO_INCREMENTAL=0
          sh .forgejo/scripts/run-logged.sh fmt-sokar cargo fmt -p sokar -p sokar-client -- --check
          sh .forgejo/scripts/run-logged.sh clippy-sokar cargo clippy --locked -p sokar -p sokar-client --all-targets -- -D warnings
          sh .forgejo/scripts/run-logged.sh test-sokar cargo test --locked -p sokar -p sokar-client

  # Seshat crate type-check. Default features only (includes `embedding`;
  # excludes the memory-heavy `synthesis` candle feature which OOMs the runner).
  check-seshat:
    runs-on: rust
    steps:
      - name: Install dependencies
        run: |
          if ! command -v protoc >/dev/null 2>&1 || ! pkg-config --exists protobuf openssl; then
            sudo apt-get update -qq
            sudo apt-get install -qq -y build-essential pkg-config protobuf-compiler libprotobuf-dev libssl-dev
          fi

      - name: Install Rust toolchain
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi

      - name: cargo check -p seshat
        run: |
          test ! -f "$HOME/.cargo/env" || . "$HOME/.cargo/env"
          CARGO_BUILD_JOBS=2 sh .forgejo/scripts/run-logged.sh check-seshat cargo check -p seshat

  # Root akh-medu crate type-check with --features server.
  #
  # This is the job that actually verifies the agent code compiles. Previously
  # CI only built the seshat sibling crate, so "CI green" was meaningless for
  # the ~90% of the codebase that lives in src/ (agent, ACP, backend, message,
  # akhomed binary, etc.). Multiple PRs merged with hard compile errors because
  # no CI step ever attempted the build.
  #
  # The original workflow dodged the root crate because a full *release* build
  # OOM-killed the runner. `cargo check` only type-checks (no codegen, no
  # linking) so peak RSS is a fraction of a release build. We further constrain
  # memory with:
  #   CARGO_BUILD_JOBS=1       — serialize rustc invocations
  #   CARGO_PROFILE_DEV_DEBUG=0 — strip debug info (large RSS contributor)
  #   RUSTC_WRAPPER=sccache    — cache dependency compilation across runs
  #                              (sccache is the global rustc wrapper on the
  #                              build hosts; this just makes it explicit)
  #
  # Do not promote the repository's existing warning baseline to errors here:
  # that made clean branches red after the type-check had already passed. A
  # warning-denying clippy gate can be added once main itself is warning-free.
  check-akh-medu:
    runs-on: rust
    steps:
      - name: Install dependencies
        run: |
          if ! command -v protoc >/dev/null 2>&1 || ! pkg-config --exists protobuf openssl; then
            sudo apt-get update -qq
            sudo apt-get install -qq -y build-essential pkg-config protobuf-compiler libprotobuf-dev libssl-dev
          fi

      - name: Install Rust toolchain
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi

      - name: cargo check --features server
        run: |
          test ! -f "$HOME/.cargo/env" || . "$HOME/.cargo/env"
          export CARGO_BUILD_JOBS=1
          export CARGO_PROFILE_DEV_DEBUG=0
          if command -v sccache >/dev/null 2>&1; then
            if sccache --start-server >/dev/null 2>&1; then
              export RUSTC_WRAPPER=sccache
            else
              # Cache availability is not compiler correctness. Compile directly
              # if the cache service cannot start; never relabel this as CI green.
              unset RUSTC_WRAPPER
            fi
          fi
          sh .forgejo/scripts/run-logged.sh check-server cargo check --features server

  # Library tests for the root crate. Uses the `postgres` feature (which pulls
  # in akhomed-store + tokio) rather than the full `server` feature set (which
  # adds ACP, OTel, remote-executor) to avoid the ENOSPC link failure observed
  # with `--features server --lib` on dev machines — the akhomed binary is
  # enormous and linking it exhausts disk. `--lib` skips binary targets
  # entirely, testing only the library crate.
  test-akh-medu:
    runs-on: rust
    steps:
      - name: Install dependencies
        run: |
          if ! command -v protoc >/dev/null 2>&1 || ! pkg-config --exists protobuf openssl; then
            sudo apt-get update -qq
            sudo apt-get install -qq -y build-essential pkg-config protobuf-compiler libprotobuf-dev libssl-dev
          fi

      - name: Install Rust toolchain
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi

      - name: cargo test --features postgres --lib
        run: |
          test ! -f "$HOME/.cargo/env" || . "$HOME/.cargo/env"
          export CARGO_BUILD_JOBS=1
          export CARGO_PROFILE_DEV_DEBUG=0
          if command -v sccache >/dev/null 2>&1; then
            if sccache --start-server >/dev/null 2>&1; then
              export RUSTC_WRAPPER=sccache
            else
              # Cache availability is not compiler correctness. Compile directly
              # if the cache service cannot start; never relabel this as CI green.
              unset RUSTC_WRAPPER
            fi
          fi
          # Keep failures and totals without thousands of per-test success lines.
          # The remote log collector otherwise outlives this suite by many minutes.
          sh .forgejo/scripts/run-logged.sh library-tests cargo test --quiet --features postgres --lib
          sh .forgejo/scripts/run-logged.sh shell-cwd-tests cargo test --quiet --features postgres --test shell_exec_cwd -- --test-threads=1
          # Phase 53 (ADR 113): the additive `/v1` core API (tool scopes, event
          # admission, delegation grants) only compiles under the full `server`
          # profile. `--lib` keeps the enormous akhomed binary out of the link;
          # capture is unset so the suite never writes transcript files.
          sh .forgejo/scripts/run-logged.sh core-service-tests env -u AKH_TRANSCRIPT_CAPTURE cargo test --quiet --features server --lib core_service -- --test-threads=1

  docker-seshd:
    runs-on: rust
    # Intentionally independent of check-seshat so that one doesn't block the
    # other. The docker build itself catches anything check missed.
    #
    # Auth: Solstice's workflow-runner writes /home/sol/.docker/config.json
    # at VM boot from repo secrets in priority order
    #   REGISTRY_TOKEN > PACKAGES_TOKEN > FORGEJO_TOKEN > GITHUB_TOKEN
    # with username from REGISTRY_USERNAME (default "token", which Forgejo's
    # registry rejects on POST). Required repo secrets for push to succeed:
    #   REGISTRY_TOKEN     = a Forgejo PAT with scope: write:package
    #   REGISTRY_USERNAME  = toasterson
    # Both live at .../toasterson/akh-medu/settings/actions/secrets.
    # We deliberately do NOT add an explicit `docker login` step here:
    # Solstice's auto-auth runs before any step, and an explicit login step
    # would just overwrite ~/.docker/config.json with whatever raw string
    # we give it (Solstice doesn't yet substitute ${{ secrets.X }} inside
    # step env: blocks — only in runs-on).
    #
    # Branch detection lives in `.forgejo/scripts/resolve-branch.sh` — it's
    # called inline in each step that needs $BRANCH because $GITHUB_ENV
    # isn't reliably set on Solstice (an earlier `echo BRANCH=... >> "$GITHUB_ENV"`
    # crashed dash with `ambiguous redirect` and silently killed the job).
    steps:
      - name: Build seshd image
        # Always runs — PRs need to catch Dockerfile regressions. On
        # main/develop the image gets an additional branch-named tag ready
        # for the push step.
        run: |
          set -eu
          REGISTRY=code.aopc.cloud/toasterson
          SHA=${SOLSTICE_COMMIT_SHA:-${GITHUB_SHA:-local}}
          SHORT_SHA=$(printf '%s' "$SHA" | cut -c1-12)
          BRANCH=$(sh .forgejo/scripts/resolve-branch.sh)
          echo "detected branch: '$BRANCH'"
          TAGS="-t $REGISTRY/seshd:$SHORT_SHA"
          case "$BRANCH" in
            main|develop)
              TAGS="$TAGS -t $REGISTRY/seshd:$BRANCH"
              ;;
          esac
          echo "building with tags: $TAGS"
          sh .forgejo/scripts/run-logged.sh build-seshd docker build -f docker/seshd.Dockerfile $TAGS .

      - name: Smoke-test seshd binary (catch stub-binary regression)
        run: |
          set -eu
          REGISTRY=code.aopc.cloud/toasterson
          SHA=${SOLSTICE_COMMIT_SHA:-${GITHUB_SHA:-local}}
          SHORT_SHA=$(printf '%s' "$SHA" | cut -c1-12)
          SMOKE=$(docker run --rm --entrypoint seshd "$REGISTRY/seshd:$SHORT_SHA" /nonexistent 2>&1 || true)
          echo "smoke output: $SMOKE"
          if [ -z "$SMOKE" ]; then
            echo "seshd produced no output for a missing config - likely stub binary" >&2
            exit 1
          fi

      - name: Push seshd image
        # Two pushes, two different gates:
        #
        #   * SHORT_SHA tag — always pushed, because downstream (the flux
        #     HelmRelease) pins to this to get reproducible deploys. It's
        #     the tag that actually matters.
        #
        #   * branch tag (`:main` / `:develop`) — only pushed when we can
        #     confidently identify the branch. Resolving in-script means we
        #     don't depend on `github.*` expression support (inconsistent on
        #     Solstice) and don't die on the empty-branch case.
        #     This push is non-fatal: some registry configurations return
        #     non-200 when the same digest is pushed under an existing mutable
        #     tag, but the artifact is present and correct.
        #
        run: |
          set -eu
          REGISTRY=code.aopc.cloud/toasterson
          SHA=${SOLSTICE_COMMIT_SHA:-${GITHUB_SHA:-local}}
          SHORT_SHA=$(printf '%s' "$SHA" | cut -c1-12)

          if [ "${CI_DEBUG:-0}" = "1" ]; then
            echo "=== CI_DEBUG env ===" && env | sort
            echo "=== git log --oneline -5 ===" && git log --oneline -5 || true
            echo "=== docker info ===" && docker info || true
            echo "=== docker images ===" && docker images || true
          fi

          # sha tag always gets pushed — this is the canonical deploy artifact
          sh .forgejo/scripts/run-logged.sh push-seshd docker push "$REGISTRY/seshd:$SHORT_SHA"

          # branch tag only if the branch actually resolves cleanly.
          # Non-fatal: pushing the same digest under an existing mutable tag
          # may return non-zero on some registry configurations; the SHA tag
          # above already carries the important artifact.
          BRANCH=$(sh .forgejo/scripts/resolve-branch.sh)
          echo "resolved branch: '$BRANCH'"
          case "$BRANCH" in
            main|develop)
              if ! docker push "$REGISTRY/seshd:$BRANCH"; then
                echo "non-fatal: branch tag push returned non-zero (digest likely already current in registry)" >&2
              fi
              ;;
            *)
              echo "skipping branch tag — branch '$BRANCH' is not main/develop"
              ;;
          esac

  # Sokar artifact daemon image (akh-medu Phase 52, ADR 108) — same shape as
  # the seshd job: SHORT_SHA tag always pushed (the flux HelmRelease pins it),
  # branch tag on main/develop. No ONNX stage; needs only the workspace source.
  docker-sokard:
    runs-on: rust
    # Intentionally independent of check-seshat so that one doesn't block the
    # other. The docker build itself catches anything check missed.
    #
    # Auth: Solstice's workflow-runner writes /home/sol/.docker/config.json
    # at VM boot from repo secrets in priority order
    #   REGISTRY_TOKEN > PACKAGES_TOKEN > FORGEJO_TOKEN > GITHUB_TOKEN
    # with username from REGISTRY_USERNAME (default "token", which Forgejo's
    # registry rejects on POST). Required repo secrets for push to succeed:
    #   REGISTRY_TOKEN     = a Forgejo PAT with scope: write:package
    #   REGISTRY_USERNAME  = toasterson
    # Both live at .../toasterson/akh-medu/settings/actions/secrets.
    # We deliberately do NOT add an explicit `docker login` step here:
    # Solstice's auto-auth runs before any step, and an explicit login step
    # would just overwrite ~/.docker/config.json with whatever raw string
    # we give it (Solstice doesn't yet substitute ${{ secrets.X }} inside
    # step env: blocks — only in runs-on).
    #
    # Branch detection lives in `.forgejo/scripts/resolve-branch.sh` — it's
    # called inline in each step that needs $BRANCH because $GITHUB_ENV
    # isn't reliably set on Solstice (an earlier `echo BRANCH=... >> "$GITHUB_ENV"`
    # crashed dash with `ambiguous redirect` and silently killed the job).
    steps:
      - name: Build sokard image
        # Always runs — PRs need to catch Dockerfile regressions. On
        # main/develop the image gets an additional branch-named tag ready
        # for the push step.
        run: |
          set -eu
          REGISTRY=code.aopc.cloud/toasterson
          SHA=${SOLSTICE_COMMIT_SHA:-${GITHUB_SHA:-local}}
          SHORT_SHA=$(printf '%s' "$SHA" | cut -c1-12)
          BRANCH=$(sh .forgejo/scripts/resolve-branch.sh)
          echo "detected branch: '$BRANCH'"
          TAGS="-t $REGISTRY/sokard:$SHORT_SHA"
          case "$BRANCH" in
            main|develop)
              TAGS="$TAGS -t $REGISTRY/sokard:$BRANCH"
              ;;
          esac
          echo "building with tags: $TAGS"
          sh .forgejo/scripts/run-logged.sh build-sokard docker build -f docker/sokard.Dockerfile $TAGS .

      - name: Smoke-test sokard binary (catch stub-binary regression)
        run: |
          set -eu
          REGISTRY=code.aopc.cloud/toasterson
          SHA=${SOLSTICE_COMMIT_SHA:-${GITHUB_SHA:-local}}
          SHORT_SHA=$(printf '%s' "$SHA" | cut -c1-12)
          SMOKE=$(docker run --rm --entrypoint sokard "$REGISTRY/sokard:$SHORT_SHA" /nonexistent 2>&1 || true)
          echo "smoke output: $SMOKE"
          if [ -z "$SMOKE" ]; then
            echo "sokard produced no output for a missing config - likely stub binary" >&2
            exit 1
          fi

      - name: Push sokard image
        # Two pushes, two different gates:
        #
        #   * SHORT_SHA tag — always pushed, because downstream (the flux
        #     HelmRelease) pins to this to get reproducible deploys. It's
        #     the tag that actually matters.
        #
        #   * branch tag (`:main` / `:develop`) — only pushed when we can
        #     confidently identify the branch. Resolving in-script means we
        #     don't depend on `github.*` expression support (inconsistent on
        #     Solstice) and don't die on the empty-branch case.
        #     This push is non-fatal: some registry configurations return
        #     non-200 when the same digest is pushed under an existing mutable
        #     tag, but the artifact is present and correct.
        #
        run: |
          set -eu
          REGISTRY=code.aopc.cloud/toasterson
          SHA=${SOLSTICE_COMMIT_SHA:-${GITHUB_SHA:-local}}
          SHORT_SHA=$(printf '%s' "$SHA" | cut -c1-12)

          if [ "${CI_DEBUG:-0}" = "1" ]; then
            echo "=== CI_DEBUG env ===" && env | sort
            echo "=== git log --oneline -5 ===" && git log --oneline -5 || true
            echo "=== docker info ===" && docker info || true
            echo "=== docker images ===" && docker images || true
          fi

          # sha tag always gets pushed — this is the canonical deploy artifact
          sh .forgejo/scripts/run-logged.sh push-sokard docker push "$REGISTRY/sokard:$SHORT_SHA"

          # branch tag only if the branch actually resolves cleanly.
          # Non-fatal: pushing the same digest under an existing mutable tag
          # may return non-zero on some registry configurations; the SHA tag
          # above already carries the important artifact.
          BRANCH=$(sh .forgejo/scripts/resolve-branch.sh)
          echo "resolved branch: '$BRANCH'"
          case "$BRANCH" in
            main|develop)
              if ! docker push "$REGISTRY/sokard:$BRANCH"; then
                echo "non-fatal: branch tag push returned non-zero (digest likely already current in registry)" >&2
              fi
              ;;
            *)
              echo "skipping branch tag — branch '$BRANCH' is not main/develop"
              ;;
          esac

  # Agent-session transcript harvest image (ADR 119, plan
  # docs/ai/plans/2026-09-19-transcript-harvest.md) — same shape as the
  # seshd/sokard jobs: SHORT_SHA tag always pushed (the flux HelmRelease
  # pins it), branch tag on main/develop.
  #
  # Unlike seshd/sokard, docker/akh-transcripts.Dockerfile uses BuildKit
  # cache mounts keyed on TARGETPLATFORM (repo Dockerfile convention), so
  # this job exports DOCKER_BUILDKIT=1 explicitly — plain `docker build`
  # without it cannot parse `--mount=type=cache`. seshd/sokard deliberately
  # avoid this ("legacy docker builder... without buildx") for the `rust`
  # runner; if that constraint turns out to still apply here, this job (and
  # only this job) will need to drop the cache mounts from the Dockerfile.
  docker-akh-transcripts:
    runs-on: rust
    # Intentionally independent of check-seshat so that one doesn't block the
    # other. The docker build itself catches anything check missed.
    #
    # Auth: Solstice's workflow-runner writes /home/sol/.docker/config.json
    # at VM boot from repo secrets in priority order
    #   REGISTRY_TOKEN > PACKAGES_TOKEN > FORGEJO_TOKEN > GITHUB_TOKEN
    # with username from REGISTRY_USERNAME (default "token", which Forgejo's
    # registry rejects on POST). Required repo secrets for push to succeed:
    #   REGISTRY_TOKEN     = a Forgejo PAT with scope: write:package
    #   REGISTRY_USERNAME  = toasterson
    # Both live at .../toasterson/akh-medu/settings/actions/secrets.
    # We deliberately do NOT add an explicit `docker login` step here:
    # Solstice's auto-auth runs before any step, and an explicit login step
    # would just overwrite ~/.docker/config.json with whatever raw string
    # we give it (Solstice doesn't yet substitute ${{ secrets.X }} inside
    # step env: blocks — only in runs-on).
    #
    # Branch detection lives in `.forgejo/scripts/resolve-branch.sh` — it's
    # called inline in each step that needs $BRANCH because $GITHUB_ENV
    # isn't reliably set on Solstice (an earlier `echo BRANCH=... >> "$GITHUB_ENV"`
    # crashed dash with `ambiguous redirect` and silently killed the job).
    steps:
      - name: Build akh-transcripts image
        # Always runs — PRs need to catch Dockerfile regressions. On
        # main/develop the image gets an additional branch-named tag ready
        # for the push step.
        run: |
          set -eu
          export DOCKER_BUILDKIT=1
          REGISTRY=code.aopc.cloud/toasterson
          SHA=${SOLSTICE_COMMIT_SHA:-${GITHUB_SHA:-local}}
          SHORT_SHA=$(printf '%s' "$SHA" | cut -c1-12)
          BRANCH=$(sh .forgejo/scripts/resolve-branch.sh)
          echo "detected branch: '$BRANCH'"
          TAGS="-t $REGISTRY/akh-transcripts:$SHORT_SHA"
          case "$BRANCH" in
            main|develop)
              TAGS="$TAGS -t $REGISTRY/akh-transcripts:$BRANCH"
              ;;
          esac
          echo "building with tags: $TAGS"
          sh .forgejo/scripts/run-logged.sh build-akh-transcripts docker build -f docker/akh-transcripts.Dockerfile $TAGS .

      - name: Smoke-test akh-transcripts binaries (catch stub-binary regression)
        # Three binaries in this image; each is env-var-configured (no config
        # file), so running with no env set should fail loudly with a miette
        # diagnostic on stderr rather than exit silently — silence here is
        # what a leftover `fn main() {}` stub build would look like.
        run: |
          set -eu
          REGISTRY=code.aopc.cloud/toasterson
          SHA=${SOLSTICE_COMMIT_SHA:-${GITHUB_SHA:-local}}
          SHORT_SHA=$(printf '%s' "$SHA" | cut -c1-12)
          for bin in akh-harvest akh-derive akh-transcripts-mcp; do
            SMOKE=$(docker run --rm --entrypoint "$bin" "$REGISTRY/akh-transcripts:$SHORT_SHA" /nonexistent 2>&1 || true)
            echo "smoke output ($bin): $SMOKE"
            if [ -z "$SMOKE" ]; then
              echo "$bin produced no output for a missing config - likely stub binary" >&2
              exit 1
            fi
          done

      - name: Push akh-transcripts image
        # Two pushes, two different gates:
        #
        #   * SHORT_SHA tag — always pushed, because downstream (the flux
        #     HelmRelease) pins to this to get reproducible deploys. It's
        #     the tag that actually matters.
        #
        #   * branch tag (`:main` / `:develop`) — only pushed when we can
        #     confidently identify the branch. Resolving in-script means we
        #     don't depend on `github.*` expression support (inconsistent on
        #     Solstice) and don't die on the empty-branch case.
        #     This push is non-fatal: some registry configurations return
        #     non-200 when the same digest is pushed under an existing mutable
        #     tag, but the artifact is present and correct.
        #
        run: |
          set -eu
          REGISTRY=code.aopc.cloud/toasterson
          SHA=${SOLSTICE_COMMIT_SHA:-${GITHUB_SHA:-local}}
          SHORT_SHA=$(printf '%s' "$SHA" | cut -c1-12)

          if [ "${CI_DEBUG:-0}" = "1" ]; then
            echo "=== CI_DEBUG env ===" && env | sort
            echo "=== git log --oneline -5 ===" && git log --oneline -5 || true
            echo "=== docker info ===" && docker info || true
            echo "=== docker images ===" && docker images || true
          fi

          # sha tag always gets pushed — this is the canonical deploy artifact
          sh .forgejo/scripts/run-logged.sh push-akh-transcripts docker push "$REGISTRY/akh-transcripts:$SHORT_SHA"

          # branch tag only if the branch actually resolves cleanly.
          # Non-fatal: pushing the same digest under an existing mutable tag
          # may return non-zero on some registry configurations; the SHA tag
          # above already carries the important artifact.
          BRANCH=$(sh .forgejo/scripts/resolve-branch.sh)
          echo "resolved branch: '$BRANCH'"
          case "$BRANCH" in
            main|develop)
              if ! docker push "$REGISTRY/akh-transcripts:$BRANCH"; then
                echo "non-fatal: branch tag push returned non-zero (digest likely already current in registry)" >&2
              fi
              ;;
            *)
              echo "skipping branch tag — branch '$BRANCH' is not main/develop"
              ;;
          esac

  # Publish the Helm chart to the OCI registry on every main/develop push
  # whose Chart.yaml version isn't already present. Versioning is manual
  # (bump `charts/akh-medu/Chart.yaml version:` in the same commit that
  # changes chart templates or values); CI just handles the publishing.
  #
  # Independent of docker-seshd so a broken image build doesn't hold back
  # a chart fix, and vice versa. Auth: same Solstice-populated docker
  # credentials as the image push — helm 3.8+ OCI uses the docker config.
  publish-chart:
    runs-on: rust
    steps:
      - name: Install Helm
        run: |
          set -eu
          HELM_VERSION=v3.17.0
          curl -fsSL -o /tmp/helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/helm.tgz -C /tmp/
          sudo install -m755 /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Package + publish chart to OCI
        run: |
          set -eu
          BRANCH=$(sh .forgejo/scripts/resolve-branch.sh)
          echo "detected branch: '$BRANCH'"

          if [ "${CI_DEBUG:-0}" = "1" ]; then
            echo "=== CI_DEBUG env ===" && env | sort
            echo "=== git log --oneline -5 ===" && git log --oneline -5 || true
            echo "=== helm version ===" && helm version --short || true
          fi

          # NO mid-script `exit 0` anywhere in this step: the Solstice runner
          # has been observed mapping early-exit-0 script deaths to failure
          # (status.code().unwrap_or(1) on a reaped-elsewhere wait status —
          # every historical failure of this job took an early-exit path and
          # every success ran to the end). Structure as if/else fall-through
          # so the shell always reaches the natural end of the script.
          if [ "$BRANCH" != "main" ] && [ "$BRANCH" != "develop" ]; then
            echo "skipping chart publish — branch '$BRANCH' is not main/develop"
          else
            REGISTRY=oci://code.aopc.cloud/toasterson
            CHART_DIR=charts/akh-medu
            CHART_VERSION=$(awk '/^version:/ {print $2; exit}' "$CHART_DIR/Chart.yaml")
            if [ -z "$CHART_VERSION" ]; then
              echo "ERROR: could not read chart version from $CHART_DIR/Chart.yaml" >&2
              exit 1
            fi
            echo "chart version from Chart.yaml: $CHART_VERSION"

            # Idempotence: `helm pull` against a missing version returns
            # non-zero, against an existing version succeeds and writes a
            # .tgz into /tmp/check.
            mkdir -p /tmp/check
            if helm pull "$REGISTRY/akh-medu" --version "$CHART_VERSION" -d /tmp/check >/dev/null 2>&1; then
              echo "chart akh-medu-$CHART_VERSION already published; nothing to do"
            else
              # NOTE: we intentionally skip `helm dependency update` — the only
              # dependency is Bitnami postgresql (gated behind postgresql.enabled,
              # which is always false in production because we use the shared
              # CNPG postgres-ha cluster). Pulling from Docker Hub also risks
              # anonymous-pull rate-limits. If a future chart grows a dep that
              # must ship bundled, add it here.
              mkdir -p /tmp/pkg
              helm package "$CHART_DIR" -d /tmp/pkg

              # Non-fatal push: helm push returns non-zero if the version
              # already exists (e.g. the idempotence check above raced).
              if ! helm push "/tmp/pkg/akh-medu-$CHART_VERSION.tgz" "$REGISTRY"; then
                # Verify the version really is in the registry before declaring success.
                if helm pull "$REGISTRY/akh-medu" --version "$CHART_VERSION" -d /tmp/check >/dev/null 2>&1; then
                  echo "non-fatal: helm push returned non-zero but akh-medu-$CHART_VERSION is present in registry" >&2
                else
                  echo "ERROR: helm push failed and chart version $CHART_VERSION is not reachable in registry" >&2
                  exit 1
                fi
              else
                echo "published akh-medu-$CHART_VERSION to $REGISTRY"
              fi
            fi
          fi
          echo "chart publish step complete"

  platform-images-home:
    runs-on: rust
    needs: [test-session-platform, check-akh-medu, test-akh-medu, test-sokar, check-seshat]
    steps:
      - name: Install Python and bounded group builder
        run: |
          sh .forgejo/scripts/install-ci-python.sh
          if [ "$(sh .forgejo/scripts/resolve-branch.sh)" = main ]; then
            sh .forgejo/scripts/setup-platform-buildx.sh
          fi
      - name: Build or collect verified home images
        run: $HOME/.local/bin/akh-ci-python .forgejo/scripts/build-platform-images.py home

