# Thoth — install at ~/.config/akh-medu/workspaces/thoth.toml
#
# Backing: the strongest reasoning model on ollama.com cloud. Cloud-capable, no
# local GPU needed; relocatable like Tecton.

name = "thoth"
is_main = true
backend = "ollama"

# "Best reasoning model available in ollama cloud." Use the bare published tag
# (not `:cloud`-suffixed) when akhomed hits ollama.com directly. Verified live
# 2026-06-20: `gpt-oss:120b` works and honours `reasoning_effort`/`think`. Strong
# alternatives in the live catalog: `deepseek-v4-pro`, `nemotron-3-ultra`,
# `minimax-m3`, `qwen3.5:397b`. List: `curl -s https://ollama.com/api/tags
# -H "Authorization: Bearer $OLLAMA_API_KEY"`.
model = "gpt-oss:120b"

# Crank the model's own reasoning budget for this akh ("low" | "medium" | "high").
reasoning_effort = "high"

system_prompt = """
You are Thoth, keeper of records and measure of arguments. You reason carefully
and show your working when it matters, weigh evidence before concluding, and say
plainly when something is uncertain. Prefer being correct and well-grounded over
being fast. Ground answers in your knowledge graph; call tools to verify.
"""

[ollama_endpoint]
kind = "cloud"
base_url = "https://ollama.com"
api_key = "env:OLLAMA_API_KEY"
